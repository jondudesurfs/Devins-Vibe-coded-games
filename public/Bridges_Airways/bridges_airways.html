<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1c33">
<title>Bridge's Airways</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d1c33; --ink2:#16294a; --ink3:#20395f;
  --paper:#f4ead2; --paper2:#e3d4b0;
  --jet:#ee5a24; --jet2:#ff8043;
  --mint:#28a08b; --gold:#f0b429; --red:#d94040; --rival:#7b5ea7;
  --line:rgba(244,234,210,.16);
  --disp:'Archivo Black','Haettenschweiler','Arial Black',sans-serif;
  --body:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;
  --mono:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:14px;line-height:1.35;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#app{display:flex;flex-direction:column;height:100%;height:100dvh}

/* ---------- top bar: fits without scrolling ---------- */
#topbar{display:flex;align-items:center;background:var(--ink2);border-bottom:2px solid #000;
  flex:0 0 auto;padding:5px 8px;padding-top:calc(5px + env(safe-area-inset-top));gap:6px}
.brand{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.brand .mark{width:26px;height:26px;flex:0 0 26px}
.brand h1{font-family:var(--disp);font-size:11px;margin:0;letter-spacing:.01em;line-height:1.05;white-space:nowrap}
.brand h1 span{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.18em;color:var(--jet2);font-weight:400}
#stats{display:flex;flex:1;min-width:0;gap:2px}
.stat{flex:1 1 0;min-width:0;padding:2px 4px;text-align:center;border-left:1px solid var(--line)}
.stat .k{font-family:var(--mono);font-size:7.5px;letter-spacing:.1em;opacity:.5;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-family:var(--mono);font-size:clamp(11px,2.6vw,15px);font-weight:500;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.stat .v.pos{color:var(--mint)} .stat .v.neg{color:var(--red)} .stat .v.warn{color:var(--gold)}
#speed{display:flex;align-items:center;gap:3px;flex:0 0 auto}
#speed button{font-family:var(--mono);font-size:10px;width:26px;height:26px;border-radius:5px;
  background:var(--ink3);color:var(--paper);opacity:.6;transition:.12s;padding:0}
#speed button.on{background:var(--jet);opacity:1}
#speed button:active{transform:scale(.94)}

#main{flex:1;display:flex;min-height:0}
#mapwrap{flex:1;position:relative;min-width:0;background:var(--paper)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#mapbtns{position:absolute;right:9px;top:9px;display:flex;flex-direction:column;gap:5px}
#mapbtns button{width:32px;height:32px;border-radius:7px;background:rgba(13,28,51,.82);color:var(--paper);
  font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(244,234,210,.2);font-family:var(--mono)}
#mapbtns button:active{background:var(--jet)}
#ticker{position:absolute;left:0;right:0;bottom:0;background:rgba(13,28,51,.92);font-family:var(--mono);
  font-size:11px;padding:6px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border-top:1px solid var(--line)}
#ticker b{color:var(--gold);font-weight:500}

#side{width:352px;flex:0 0 352px;background:var(--ink2);border-left:2px solid #000;display:flex;
  flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1px solid #000;background:var(--ink)}
#tabs button{flex:1;padding:11px 2px 9px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;opacity:.5;border-bottom:3px solid transparent}
#tabs button.on{opacity:1;border-bottom-color:var(--jet);background:var(--ink2)}
#tabs button.alert{opacity:1;color:var(--gold)}
#panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom))}

/* map fullscreen */
body.mapfull #side{display:none}
body.mapfull #mapwrap{flex:1}
body.mapfull #topbar{padding-top:calc(3px + env(safe-area-inset-top));padding-bottom:3px}

h2.sec{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.55;
  margin:0 0 8px;font-weight:400}
h2.sec:not(:first-child){margin-top:20px}
.card{background:var(--ink3);border-radius:8px;padding:11px 12px;margin-bottom:8px;border:1px solid var(--line)}
.card.sel{border-color:var(--jet);box-shadow:0 0 0 1px var(--jet)}
.card.rival{border-color:rgba(123,94,167,.6)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row+.row{margin-top:5px}
.ttl{font-weight:700;font-size:14px}
.sub{font-family:var(--mono);font-size:10.5px;opacity:.6}
.fact{font-size:12.5px;line-height:1.55;opacity:.9;margin-top:7px;border-left:2px solid var(--gold);padding-left:9px}
.num{font-family:var(--mono);font-size:12.5px}
.pos{color:var(--mint)} .neg{color:var(--red)} .warn{color:var(--gold)} .riv{color:#b49ad6}
.btn{background:var(--jet);color:#fff;border-radius:6px;padding:8px 12px;font-weight:700;font-size:12.5px;
  transition:.12s;text-align:center}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--paper);font-weight:500}
.btn.mint{background:var(--mint)}
.btn.sm{padding:5px 9px;font-size:11.5px}
.btn[disabled]{opacity:.32;cursor:not-allowed;transform:none!important}
.btn.wide{display:block;width:100%;margin-top:6px}
.pill{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:99px;background:rgba(244,234,210,.1);
  letter-spacing:.06em}
.pill.riv{background:rgba(123,94,167,.3);color:#d3c4ea}
.bar{height:6px;border-radius:99px;background:rgba(0,0,0,.32);overflow:hidden;margin-top:6px;display:flex}
.bar i{display:block;height:100%;background:var(--mint);transition:width .3s}
.bar i.gold{background:var(--gold)} .bar i.jet{background:var(--jet)} .bar i.rival{background:var(--rival)}
.opts{display:flex;gap:6px;margin-top:8px}
.opts button{flex:1;padding:9px 4px;border-radius:6px;background:rgba(0,0,0,.25);border:1px solid transparent;
  font-size:11.5px;font-weight:600;line-height:1.25}
.opts button small{display:block;font-family:var(--mono);font-size:9px;opacity:.6;font-weight:400;margin-top:2px}
.opts button.on{background:var(--jet);border-color:var(--jet2)}
.empty{text-align:center;padding:26px 12px;opacity:.45;font-size:12.5px;font-family:var(--mono);line-height:1.6}
.hintbox{background:rgba(240,180,41,.12);border:1px solid rgba(240,180,41,.35);border-radius:8px;
  padding:10px 12px;font-size:12.5px;margin-bottom:10px}
.hintbox b{color:var(--gold)}
.split{display:flex;gap:6px}
.split>*{flex:1}
input[type=range]{width:100%;accent-color:var(--jet);margin:10px 0 2px}

.overlay{position:fixed;inset:0;background:rgba(6,13,24,.86);z-index:40;display:flex;align-items:center;
  justify-content:center;padding:18px;backdrop-filter:blur(3px)}
.modal{background:var(--ink2);border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;
  max-height:88vh;overflow-y:auto;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal h3{font-family:var(--disp);font-size:22px;margin:0 0 4px;line-height:1.1}
.modal p{font-size:13.5px;opacity:.86;margin:0 0 14px;line-height:1.55}
.kv{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;padding:5px 0;
  border-bottom:1px dashed var(--line);gap:10px}
.starter{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.starter button{text-align:left;background:var(--ink3);border:1px solid var(--line);border-radius:9px;
  padding:12px;transition:.12s}
.starter button:hover,.starter button:active{border-color:var(--jet);background:#26426d}
.starter b{display:block;font-size:14px;margin-bottom:3px}
.starter .sub{font-size:10.5px}

/* trivia */
.quiz{background:var(--ink3);border-radius:10px;padding:15px;margin:12px 0;border:1px solid var(--line)}
.quiz .q{font-size:15px;font-weight:700;line-height:1.35;margin-bottom:12px}
.quiz button.ans{display:block;width:100%;text-align:left;background:rgba(0,0,0,.28);border:1px solid var(--line);
  border-radius:8px;padding:12px 14px;margin-bottom:7px;font-size:13.5px;transition:.12s}
.quiz button.ans:active{transform:scale(.985)}
.quiz button.ans.right{background:var(--mint);border-color:var(--mint);font-weight:700}
.quiz button.ans.wrong{background:var(--red);border-color:var(--red)}
.quiz .why{font-size:12.5px;line-height:1.55;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);opacity:.92}

.pass{background:var(--paper);color:var(--ink);border-radius:12px;overflow:hidden;margin-bottom:16px}
.pass .top{display:flex;justify-content:space-between;align-items:flex-end;padding:16px 18px 12px}
.pass .top h3{font-family:var(--disp);font-size:26px;line-height:.94;margin:0;color:var(--ink)}
.pass .top .code{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--jet)}
.pass .perf{border-top:2px dashed var(--paper2);padding:10px 18px 14px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:#5b6b83;display:flex;justify-content:space-between}

@media (max-width:820px){
  #main{flex-direction:column}
  #side{width:auto;flex:1 1 auto;border-left:none;border-top:2px solid #000}
  #mapwrap{flex:0 0 44%;min-height:210px}
  body.mapfull #mapwrap{flex:1 1 auto}
  .brand h1{display:none}
  .starter{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

     SPR.needle = {img: <HTMLImageElement>, w: 96, h: 128};   // true pixel size

   =================================================================== */

const RIVAL={name:"Tunnel Air", tag:"TNL"};

/* ===================================================================
   ECONOMY CORE — pure functions, no DOM.
   =================================================================== */
//--ECON-START--
const ECON={
  DEMAND_K:60, FARE_BASE:60, FARE_KM:0.115, FUEL_$:1.0,
  UTIL_H:10, TURN_H:0.6, MAX_RT:5,
  LAND_FEE:130, HQ:1500, BASE_FEE:600, LOAN_APR:0.09, LOAN_CREEP:0.09,
  LOAN_MAX:0.36, ELAST:1.15
};
function gcDist(lo1,la1,lo2,la2){
  const R=6371,r=Math.PI/180;
  const dLa=(la2-la1)*r, dLo=(lo2-lo1)*r;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(a)));
}
function distFactor(d){
  return Math.max(0.04,(1-0.75*Math.exp(-d/450))*(1/(1+Math.pow(d/4200,1.6))));
}
function repMult(rep){ return (0.35+(rep/100)*1.35)/1.16; }
function priceMult(price,seatFare){
  const eff=price*Math.pow(seatFare,0.45);
  return Math.max(0.05,Math.min(2.3,1+(1-eff)*ECON.ELAST));
}
function baseDemand(sizeA,sizeB,d){ return ECON.DEMAND_K*sizeA*sizeB*distFactor(d); }
function routeDemand(sizeA,sizeB,d,rep,price,seatFare){
  return baseDemand(sizeA,sizeB,d)*repMult(rep)*priceMult(price,seatFare);
}
function fareOf(d,price,seatFare){ return (ECON.FARE_BASE+ECON.FARE_KM*d)*price*seatFare; }
function roundTrips(d,spd){ return Math.min(ECON.MAX_RT,ECON.UTIL_H/(2*(d/spd+ECON.TURN_H))); }
function seatsOf(plane,seatTier){ return Math.round(plane.seats*SEATS[seatTier].cap); }

/* how much of a contested route's traffic you keep.
   Reputation is the big lever; price is the second one. */
function marketShare(myRep,myPrice,rivalRep,rivalPrice,rivalStrength){
  const mine=Math.pow(Math.max(8,myRep),1.75)/Math.pow(Math.max(.5,myPrice),1.5);
  const theirs=Math.pow(Math.max(8,rivalRep),1.75)/Math.pow(Math.max(.5,rivalPrice),1.5)*rivalStrength;
  return Math.max(0.12,Math.min(0.95,mine/(mine+theirs)));
}
/* unhappy flyers cost real money: refunds, rebookings, angry letters */
function complaintRate(rep){ return rep>=48?0:(48-rep)*0.16; }   // $ per passenger
function upkeepPenalty(rep){ return rep>=30?1:1+(30-rep)*0.012; } // crews quit, planes sit broken

function routeDay(o){
  const {d,sizeA,sizeB,planeIds,rep,price,seatTier,snackTier,fuelIdx}=o;
  const share=o.share===undefined?1:o.share;
  const seatFare=SEATS[seatTier].fare, snack=SNACKS[snackTier];
  const demand=routeDemand(sizeA,sizeB,d,rep,price,seatFare)*share;
  let cap=0,fuel=0,crew=0,legs=0;
  for(const pid of planeIds){
    const p=PL[pid]; if(!p||p.rng<d) continue;
    const rt=roundTrips(d,p.spd);
    cap+=seatsOf(p,seatTier)*2*rt;
    fuel+=rt*2*d*p.burn*ECON.FUEL_$*fuelIdx;
    crew+=rt*2*p.crew;
    legs+=rt*2;
  }
  const pax=Math.min(cap,demand);
  const fare=fareOf(d,price,seatFare);
  const rev=pax*fare;
  const fees=legs*ECON.LAND_FEE*((sizeA+sizeB)/2);
  const snacks=pax*snack.cost;
  const refunds=pax*complaintRate(rep);
  const cost=fuel+crew+fees+snacks+refunds;
  return {demand,cap,pax,fare,rev,cost,profit:rev-cost,lf:cap>0?pax/cap:0,
          fuel,crew,fees,snacks,refunds,share};
}
function satisfaction(seatTier,snackTier,price){
  return Math.max(0,Math.min(100,52+SEATS[seatTier].sat+SNACKS[snackTier].sat-(price-1)*40));
}
function baseCost(size){ return Math.round(300000*Math.pow(size,1.9)/10000)*10000; }
/* The bank starts friendly and gets nasty. Every year you carry debt adds to
   the rate, so borrowing to grow is smart and borrowing to survive is not. */
function loanRate(daysInDebt){
  return Math.min(ECON.LOAN_MAX, ECON.LOAN_APR + ECON.LOAN_CREEP*(daysInDebt/365));
}
//--ECON-END--

const GOAL={us:{bases:20,nw:150e6}, world:{bases:20,nw:4e9}};
const DAY_MS={1:1050,2:500,4:250};
const SAVE_KEY="bridges_airways_save_v2";
const SCORE_KEY="bridges_airways_scores_v1";

function reg(a,us){ AP[a[0]]={code:a[0],name:a[1],lon:a[2],lat:a[3],size:a[4],icon:a[5],
  fact:a[6],q:a[7],opts:a[8],ans:a[9],us}; }
US_AIRPORTS.forEach(a=>reg(a,true));
W_AIRPORTS.forEach(a=>reg(a,false));

let S=null;

function newGame(starter){
  S={ v:2, stage:1, day:1, cash:600000, rep:50, loan:0,
    seat:1, snack:1, price:1.00, fuelIdx:1.00,
    owned:[starter.a,starter.b], routes:[], fleet:[{id:1,type:"dart",route:null}],
    nextPlane:2, nextRoute:1, quizzed:[starter.a,starter.b],
    sel:null, selPlane:null, tab:"network", speed:1, running:false,
    news:[], lastPL:null, domIncome:0, seed:(Math.random()*1e9)|0, evTimer:26, won:false,
    co:{on:false, rep:56, price:1.0, routes:[], timer:0},
    loanDays:0, finalScore:null,
    view:{z:1,px:0,py:0}
  };
  S.routes.push({id:S.nextRoute++,a:starter.a,b:starter.b,d:distOf(starter.a,starter.b),planes:[1]});
  S.fleet[0].route=1;
  say("WELCOME","Two cities, one propeller plane, and a dream. Watch the money roll in, then buy another plane.");
}

/* --- save / load (fails quietly if storage is blocked) --- */
let memSave=null;
function saveGame(){
  if(!S) return;
  try{ localStorage.setItem(SAVE_KEY,JSON.stringify(S)); }
  catch(e){ try{ memSave=JSON.stringify(S); }catch(e2){} }
}
function loadSave(){
  let raw=null;
  try{ raw=localStorage.getItem(SAVE_KEY); }catch(e){ raw=memSave; }
  if(!raw) raw=memSave;
  if(!raw) return null;
  try{
    const o=JSON.parse(raw);
    if(!o||o.v!==2||!o.owned||!o.routes||!o.fleet) return null;
    if(!o.co) o.co={on:false,rep:56,price:1.0,routes:[],timer:0};
    if(!o.view) o.view={z:1,px:0,py:0};
    if(!o.quizzed) o.quizzed=o.owned.slice();
    if(o.loanDays===undefined) o.loanDays=0;
    if(o.finalScore===undefined) o.finalScore=null;
    return o;
  }catch(e){ return null; }
}
function wipeSave(){ memSave=null; try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

/* --- helpers --- */
const rnd=()=>{ S.seed=(S.seed*1664525+1013904223)>>>0; return S.seed/4294967296; };
function distOf(a,b){ return gcDist(AP[a].lon,AP[a].lat,AP[b].lon,AP[b].lat); }
function routeById(id){ return S.routes.find(r=>r.id===id); }
function planeById(id){ return S.fleet.find(p=>p.id===id); }
function typesOn(r){ return r.planes.map(planeById).filter(Boolean).map(p=>p.type); }
function idleFleet(){ return S.fleet.filter(p=>p.route===null); }
function stageAirports(){ return Object.values(AP).filter(a=>S.stage===1?a.us:(!a.us||S.owned.includes(a.code))); }
function isGateway(c){ return S.stage===2&&AP[c].us; }
function baseCostFor(c){ return baseCost(AP[c].size)*(S.stage===2&&!AP[c].us?6:1); }
function fmt$(n){
  const s=n<0?"-":""; n=Math.abs(n);
  if(n>=1e9) return s+"$"+(n/1e9).toFixed(2)+"B";
  if(n>=1e6) return s+"$"+(n/1e6).toFixed(n>=1e8?0:2)+"M";
  if(n>=1e4) return s+"$"+Math.round(n/1e3)+"k";
  return s+"$"+Math.round(n).toLocaleString();
}
const fmtN=n=>Math.round(n).toLocaleString();
function netWorth(){
  let nw=S.cash-S.loan;
  for(const p of S.fleet) nw+=PL[p.type].price*0.6;
  for(const c of S.owned) if(!isGateway(c)) nw+=baseCostFor(c);
  if(S.stage===2) nw+=S.domIncome*220;
  return nw;
}
const intlBases=()=>S.owned.filter(c=>!AP[c].us).length;
const goalNow=()=>S.stage===1?GOAL.us:GOAL.world;
const goalBases=()=>S.stage===1?S.owned.length:intlBases();
function goalMet(){ const g=goalNow(); return goalBases()>=g.bases&&netWorth()>=g.nw; }
function say(tag,msg){
  S.news.unshift({tag,msg,day:S.day});
  if(S.news.length>40) S.news.pop();
  const t=document.getElementById("ticker");
  if(t) t.innerHTML="<b>"+tag+"</b> &nbsp;"+msg;
}

/* --- the rival --- */
function rivalOn(r){ return S.co.routes.find(x=>(x.a===r.a&&x.b===r.b)||(x.a===r.b&&x.b===r.a)); }
function shareOf(r){
  const c=rivalOn(r);
  if(!c) return 1;
  return marketShare(S.rep,S.price,S.co.rep,S.co.price,c.str);
}
function rivalBases(){
  const s=new Set();
  for(const c of S.co.routes){ s.add(c.a); s.add(c.b); }
  return s;
}
function rivalTurn(){
  const co=S.co;
  if(!co.on){
    if(goalBases()>=(S.stage===1?5:3)){
      co.on=true; co.timer=30;
      say("RIVAL","A rival airline called "+RIVAL.name+" just launched. Their slogan: \u201cWhy fly over it when you can go under it?\u201d");
    }
    return;
  }
  /* the rival slowly gets its act together */
  if(co.rep<68) co.rep+=0.012;
  /* players who dominate a route eventually chase the rival off it */
  for(let i=co.routes.length-1;i>=0;i--){
    const c=co.routes[i], r=S.routes.find(x=>(x.a===c.a&&x.b===c.b)||(x.a===c.b&&x.b===c.a));
    if(!r){ co.routes.splice(i,1); continue; }
    if(shareOf(r)>0.62){ c.win=(c.win||0)+1; } else { c.win=0; }
    if(c.win>45){
      co.routes.splice(i,1);
      say("VICTORY",RIVAL.name+" gave up on "+c.a+" \u21c4 "+c.b+" and slunk away. That route is all yours again.");
    } else if(c.str<1.25) c.str+=0.0012;
  }
  if(--co.timer>0) return;
  co.timer=42+Math.floor(rnd()*30);
  /* muscle in on the player's juiciest uncontested route */
  let best=null,bv=0;
  for(const r of S.routes){
    if(rivalOn(r)) continue;
    const p=evalRoute(r).profit;
    if(p>bv){ bv=p; best=r; }
  }
  if(best&&bv>9000){
    co.routes.push({a:best.a,b:best.b,str:0.75+rnd()*0.35,win:0});
    say("RIVAL",RIVAL.name+" just started flying "+best.a+" \u21c4 "+best.b+". They are splitting your passengers.");
  }
}

/* --- daily books --- */
function evalRoute(r,extraType){
  const ids=typesOn(r); if(extraType) ids.push(extraType);
  return routeDay({d:r.d,sizeA:AP[r.a].size,sizeB:AP[r.b].size,planeIds:ids,
    rep:S.rep,price:S.price,seatTier:S.seat,snackTier:S.snack,fuelIdx:S.fuelIdx,share:shareOf(r)});
}
function dailyBook(){
  let rev=0,fuel=0,crew=0,fees=0,snacks=0,refunds=0,pax=0,cap=0;
  for(const r of S.routes){
    const e=evalRoute(r);
    rev+=e.rev; fuel+=e.fuel; crew+=e.crew; fees+=e.fees; snacks+=e.snacks; refunds+=e.refunds;
    pax+=e.pax; cap+=e.cap;
  }
  let maint=0; for(const p of S.fleet) maint+=PL[p.type].maint;
  maint*=upkeepPenalty(S.rep);
  let bases=0;
  for(const c of S.owned) if(!isGateway(c)) bases+=ECON.BASE_FEE*AP[c].size*(S.stage===2?2:1);
  const hq=ECON.HQ*(S.stage===2?4:1);
  const interest=S.loan*loanRate(S.loanDays)/365;
  const dom=S.stage===2?S.domIncome:0;
  const cost=fuel+crew+fees+snacks+refunds+maint+bases+hq+interest;
  return {rev,dom,fuel,crew,fees,snacks,refunds,maint,bases,hq,interest,cost,
          profit:rev+dom-cost,pax,cap,lf:cap>0?pax/cap:0};
}

function tickDay(){
  const b=dailyBook();
  S.cash+=b.profit;
  S.lastPL=b;
  S.rep+=(satisfaction(S.seat,S.snack,S.price)-S.rep)*0.05;
  S.fuelIdx+=(1-S.fuelIdx)*0.006;
  if(S.loan>0) S.loanDays++; else S.loanDays=0;
  S.day++;
  rivalTurn();
  if(--S.evTimer<=0){
    S.evTimer=30+Math.floor(rnd()*34);
    const e=EVENTS[Math.floor(rnd()*EVENTS.length)];
    say(e.t,e.m());
  }
  if(S.loan>0 && S.loanDays>0 && S.loanDays%180===0)
    say("BANK","You have owed the bank for "+Math.round(S.loanDays/365*10)/10+" years. Your rate is now "
      +Math.round(loanRate(S.loanDays)*100)+"%. Pay it down before it eats you.");
  if(S.rep<32 && S.day%25===0)
    say("WARNING","Flyer happiness is down to "+Math.round(S.rep)+"%. People are demanding refunds and crews are quitting. Fix the cabin!");
  if(S.cash<0&&S.loan<loanCap()){
    const need=Math.min(loanCap()-S.loan,-S.cash+250000);
    S.loan+=need; S.cash+=need;
    say("BANK","You ran out of money, so the bank quietly lent you "+fmt$(need)+". They will want it back.");
  }
  if(S.day%5===0) saveGame();
  if(!S.won&&goalMet()){
    if(S.stage===1){ S.running=false; modalGoGlobal(); }
    else { S.won=true; S.running=false; modalWin(); }
  }
}

function scoreRun(){
  const nw=netWorth();
  const wealth=Math.max(0,Math.round(nw/20000));
  const fleetPts=S.fleet.length*500;
  const routePts=S.routes.length*1000;
  const base=wealth+fleetPts+routePts;
  const speed=Math.max(0.5,Math.min(2.5,2.5-S.day/800));
  return {wealth,fleetPts,routePts,base,speed,total:Math.round(base*speed),
          nw,planes:S.fleet.length,routes:S.routes.length,days:S.day,rep:Math.round(S.rep)};
}

         t>=400000?"Continental Carrier":t>=250000?"National Carrier":"Regional Operator";
}
let memScores=null;
function loadScores(){
  let raw=null;
  try{ raw=localStorage.getItem(SCORE_KEY); }catch(e){ raw=memScores; }
  if(!raw) raw=memScores;
  try{ const l=JSON.parse(raw); return Array.isArray(l)?l:[]; }catch(e){ return []; }
}
function saveScore(sc){
  const list=loadScores();
  list.push({t:Date.now(),score:sc.total,days:sc.days,nw:sc.nw,
             planes:sc.planes,routes:sc.routes,rank:rankOf(sc.total)});
  list.sort((a,b)=>b.score-a.score);

  memScores=keep;

function loanCap(){ return Math.max(2000000,Math.round((netWorth()+S.loan)*0.55)); }

/* ===================================================================
   MAP  —  vector base, zoom + pan, landmark sprites
   To drop in Adobe Firefly artwork later, fill MAPART with the image and the
   lon/lat box its edges line up with; the projection does the rest:
     MAPART[1]={img:<Image>, lon0:-126, lat0:23.5, lon1:-65, lat1:50};
   =================================================================== */
const MAPART={1:null,2:null};
/* how big landmark art draws. 1.0 was the original; 2.5 per playtest. */
const LANDMARK_SCALE=2.5;
const cv=document.getElementById("cv"), cx=cv.getContext("2d");
let VIEW={k:1,s:1,ox:0,oy:0,w:0,h:0};
let hover=null,tPlane=0;

const ZMIN=1,ZMAX=7;
function zoom(){ return S&&S.view?S.view.z:1; }
function lonLatXY(lon,lat){
  const bx=(lon*VIEW.k)*VIEW.s+VIEW.ox, by=(-lat)*VIEW.s+VIEW.oy;
  const z=zoom(),cxm=VIEW.w/2,cym=VIEW.h/2;
  return [(bx-cxm)*z+cxm+S.view.px,(by-cym)*z+cym+S.view.py];
}
function fitView(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=cv.clientWidth||900,h=cv.clientHeight||520;
  cv.width=w*dpr; cv.height=h*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  VIEW.w=w; VIEW.h=h;
  VIEW.k=S.stage===1?Math.cos(38*Math.PI/180):1;
  const box=S.stage===1?{x0:-126,x1:-65,y0:23.5,y1:50}:{x0:-172,x1:179,y0:-48,y1:70};
  const X0=box.x0*VIEW.k,X1=box.x1*VIEW.k,Y0=-box.y1,Y1=-box.y0,pad=S.stage===1?26:14;
  VIEW.s=Math.min((w-pad*2)/(X1-X0),(h-pad*2-14)/(Y1-Y0));
  VIEW.ox=(w-(X1-X0)*VIEW.s)/2-X0*VIEW.s;
  VIEW.oy=(h-14-(Y1-Y0)*VIEW.s)/2-Y0*VIEW.s;
  clampPan();
}
function clampPan(){
  const z=S.view.z, mx=VIEW.w*(z-1)/2+40, my=VIEW.h*(z-1)/2+40;
  S.view.px=Math.max(-mx,Math.min(mx,S.view.px));
  S.view.py=Math.max(-my,Math.min(my,S.view.py));
}
function zoomAt(sx,sy,factor){
  const z0=S.view.z, z1=Math.max(ZMIN,Math.min(ZMAX,z0*factor));
  if(z1===z0) return;
  const cxm=VIEW.w/2,cym=VIEW.h/2;
  const bx=(sx-cxm-S.view.px)/z0+cxm, by=(sy-cym-S.view.py)/z0+cym;
  S.view.z=z1;
  S.view.px=sx-cxm-(bx-cxm)*z1;
  S.view.py=sy-cym-(by-cym)*z1;
  clampPan();
}
function resetView(){ S.view.z=1; S.view.px=0; S.view.py=0; }

function poly(pts){
  cx.beginPath();
  for(let i=0;i<pts.length;i++){ const [x,y]=lonLatXY(pts[i][0],pts[i][1]); i?cx.lineTo(x,y):cx.moveTo(x,y); }
  cx.closePath();
}
function arcPts(a,b){
  const [x1,y1]=lonLatXY(AP[a].lon,AP[a].lat),[x2,y2]=lonLatXY(AP[b].lon,AP[b].lat);
  const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1;
  const L=Math.hypot(dx,dy)||1,bow=Math.min(46*zoom(),L*0.14);
  return {x1,y1,x2,y2,cxp:mx-dy/L*bow,cyp:my+dx/L*bow};
}
function qPoint(A,t){
  const u=1-t;
  return [u*u*A.x1+2*u*t*A.cxp+t*t*A.x2,u*u*A.y1+2*u*t*A.cyp+t*t*A.y2];
}
/* landmark: image sprite if one is registered, otherwise the code-drawn glyph */
function drawLandmark(icon,code,x,y,size,alpha){
  const key=(code&&SPR[code])?code:icon;
  const sp=SPR[key];
  if(sp&&sp.img&&META[key]){
    const m=META[key],h=size*2.2,w=h*(m.w/m.h);
    cx.globalAlpha=alpha;
    cx.drawImage(sp.img,0,0,m.w,m.h,x-w/2,y-h,w,h);
    cx.globalAlpha=1; return;
  }
  const g=GLYPH[icon]; if(!g) return;
  cx.save(); cx.translate(x,y-size*1.15); cx.globalAlpha=alpha;
  cx.beginPath(); g(cx,size);
  cx.strokeStyle="#0d1c33"; cx.lineWidth=1.5; cx.lineJoin="round"; cx.lineCap="round"; cx.stroke();
  cx.globalAlpha=1; cx.restore();
}

function draw(){
  const w=VIEW.w,h=VIEW.h,z=zoom();
  cx.fillStyle="#f4ead2"; cx.fillRect(0,0,w,h);
  const art=MAPART[S.stage];
  if(art&&art.img&&art.img.complete){
    const [ax,ay]=lonLatXY(art.lon0,art.lat1),[bx,by]=lonLatXY(art.lon1,art.lat0);
    cx.drawImage(art.img,0,0,art.img.naturalWidth,art.img.naturalHeight,ax,ay,bx-ax,by-ay);
  }else{
    cx.strokeStyle="rgba(13,28,51,.06)"; cx.lineWidth=1;
    const gs=S.stage===1?5:20;
    for(let lo=-180;lo<=180;lo+=gs){const [x]=lonLatXY(lo,0);if(x>-5&&x<w+5){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,h);cx.stroke();}}
    for(let la=-60;la<=80;la+=gs){const [,y]=lonLatXY(0,la);if(y>-5&&y<h+5){cx.beginPath();cx.moveTo(0,y);cx.lineTo(w,y);cx.stroke();}}
    cx.lineJoin="round";
    const land=p=>{poly(p);cx.fillStyle="#e6d9bd";cx.fill();cx.strokeStyle="#0d1c33";cx.lineWidth=1.4;cx.stroke();};
    if(S.stage===1){
      land(US_OUTLINE);
      poly(LAKE_MI);cx.fillStyle="#cfe0e4";cx.fill();cx.strokeStyle="#0d1c33";cx.lineWidth=1;cx.stroke();
    }else{ [W_NA,W_SA,W_EUR,W_AFR,W_AUS].forEach(land); W_ISL.forEach(land); }
  }
  /* landmarks appear as you zoom in */
  if(z>1.3){
    const a=Math.min(0.5,(z-1.3)*0.6);
    for(const ap of stageAirports()){
      if(!ap.icon) continue;
      if(z<2.2&&ap.size<4&&!S.owned.includes(ap.code)) continue;
      const [x,y]=lonLatXY(ap.lon,ap.lat);
      if(x<-40||x>w+40||y<-40||y>h+40) continue;
      const ls=(5.5+ap.size*0.7)*LANDMARK_SCALE*Math.min(3.2,0.55+z*0.55);
      drawLandmark(ap.icon,ap.code,x+ls*1.15,y-2,ls,a+(S.owned.includes(ap.code)?0.25:0));
    }
  }
  /* rival routes sit underneath yours */
  for(const c of S.co.routes){
    if(!AP[c.a]||!AP[c.b]) continue;
    const A=arcPts(c.a,c.b);
    cx.beginPath();cx.moveTo(A.x1,A.y1);cx.quadraticCurveTo(A.cxp,A.cyp,A.x2,A.y2);
    cx.setLineDash([5,5]); cx.strokeStyle="rgba(123,94,167,.75)"; cx.lineWidth=2.2; cx.stroke();
    cx.setLineDash([]);
  }
  for(const r of S.routes){
    const A=arcPts(r.a,r.b);
    cx.beginPath();cx.moveTo(A.x1,A.y1);cx.quadraticCurveTo(A.cxp,A.cyp,A.x2,A.y2);
    cx.strokeStyle=(S.sel&&(r.a===S.sel||r.b===S.sel))?"rgba(238,90,36,.95)":"rgba(238,90,36,.42)";
    cx.lineWidth=Math.min(6,1.1+r.planes.length*0.55); cx.stroke();
  }
  for(const r of S.routes){
    const A=arcPts(r.a,r.b),n=Math.min(r.planes.length,8);
    for(let i=0;i<n;i++){
      let t=(tPlane*0.055/(0.6+r.d/2600)+i/n)%2;
      const fwd=t<1; if(!fwd) t=2-t;
      const [px,py]=qPoint(A,t),[qx,qy]=qPoint(A,Math.min(1,Math.max(0,t+(fwd?0.02:-0.02))));
      cx.save(); cx.translate(px,py); cx.rotate(Math.atan2(qy-py,qx-px));
      cx.fillStyle="#0d1c33"; cx.beginPath();
      cx.moveTo(5,0);cx.lineTo(-3.4,3);cx.lineTo(-1.6,0);cx.lineTo(-3.4,-3);cx.closePath();cx.fill();
      cx.restore();
    }
  }
  const rb=rivalBases();
  for(const a of stageAirports()){
    const [x,y]=lonLatXY(a.lon,a.lat);
    if(x<-30||x>w+30||y<-30||y>h+30) continue;
    const owned=S.owned.includes(a.code),sel=S.sel===a.code,hov=hover===a.code;
    const rr=(2.4+a.size*0.95)*(z>2?1.15:1);
    if(sel||hov){cx.beginPath();cx.arc(x,y,rr+6,0,7);cx.fillStyle="rgba(240,180,41,.35)";cx.fill();}
    cx.beginPath();cx.arc(x,y,rr,0,7);
    if(owned){cx.fillStyle="#ee5a24";cx.fill();cx.strokeStyle="#0d1c33";cx.lineWidth=1.6;cx.stroke();}
    else{cx.fillStyle="#f4ead2";cx.fill();cx.strokeStyle="rgba(13,28,51,.55)";cx.lineWidth=1.4;cx.stroke();}
    if(rb.has(a.code)){cx.beginPath();cx.arc(x,y,rr+3.4,0,7);cx.strokeStyle="#7b5ea7";cx.lineWidth=1.7;cx.stroke();}
    if(isGateway(a.code)){cx.beginPath();cx.arc(x,y,rr+6,0,7);cx.strokeStyle="#28a08b";cx.lineWidth=1.6;cx.stroke();}
    if(owned||hov||sel||a.size>=5||z>1.8){
      cx.font="600 10px 'DM Mono',monospace";cx.textAlign="center";
      cx.fillStyle=owned?"#0d1c33":"rgba(13,28,51,.5)";
      cx.fillText(z>2.6?a.name:a.code,x,y-rr-4);
    }
  }
  cx.font="500 9.5px 'DM Mono',monospace";cx.textAlign="left";cx.fillStyle="rgba(13,28,51,.45)";
  cx.fillText((S.stage===1?"ROUTE MAP \u00b7 UNITED STATES":"ROUTE MAP \u00b7 WORLD")+(z>1.05?"  \u00b7  "+z.toFixed(1)+"\u00d7":""),12,18);
}
function loopDraw(){ tPlane++; draw(); }

   =================================================================== */
let AC=null;
function beep(f,dur,type,vol){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"triangle"; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.09,AC.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur+0.02);
  }catch(e){}
}
const sfxTap=()=>beep(620,0.05,"square",0.05);
const sfxBuy=()=>{beep(520,0.09);setTimeout(()=>beep(780,0.13),80);};
const sfxNo=()=>beep(150,0.16,"sawtooth",0.06);
const sfxRight=()=>{[660,880,1170].forEach((f,i)=>setTimeout(()=>beep(f,0.16),i*90));};
const sfxWrong=()=>{beep(300,0.14,"sawtooth",0.06);setTimeout(()=>beep(200,0.22,"sawtooth",0.06),140);};
const sfxBig=()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.28),i*110));};

/* ===================================================================
   ACTIONS
   =================================================================== */
function openBase(code,quiet){
  const c=baseCostFor(code);
  if(S.cash<c||S.owned.includes(code)) return sfxNo();
  S.cash-=c; S.owned.push(code);
  if(!S.quizzed.includes(code)) S.quizzed.push(code);
  sfxBuy(); saveGame();
  if(!quiet) say("NEW BASE","You opened "+AP[code].name+" ("+code+"). Welcome aboard.");
  render();
}
function buyPlane(type){
  const p=PL[type];
  if(S.cash<p.price||p.era>S.stage) return sfxNo();
  S.cash-=p.price;
  const pl={id:S.nextPlane++,type,route:null};
  S.fleet.push(pl); sfxBuy(); saveGame(); render(); return pl;
}
function sellPlane(type){
  const p=S.fleet.find(x=>x.type===type&&x.route===null);
  if(!p) return sfxNo();
  S.fleet=S.fleet.filter(x=>x!==p); S.cash+=PL[type].price*0.6; sfxTap(); saveGame(); render();
}
function assignPlane(routeId,planeId){
  const r=routeById(routeId),p=planeById(planeId);
  if(!r||!p||PL[p.type].rng<r.d) return sfxNo();
  if(p.route!==null){ const o=routeById(p.route); if(o) o.planes=o.planes.filter(i=>i!==p.id); }
  p.route=r.id; r.planes.push(p.id); sfxTap(); closeModal(); saveGame(); render();
}
function pullPlane(routeId){
  const r=routeById(routeId); if(!r||!r.planes.length) return sfxNo();
  const p=planeById(r.planes.pop()); if(p) p.route=null;
  sfxTap(); saveGame(); render();
}
function closeRoute(routeId){
  const r=routeById(routeId); if(!r) return;
  for(const id of r.planes){ const p=planeById(id); if(p) p.route=null; }
  S.routes=S.routes.filter(x=>x!==r); sfxTap(); saveGame(); render();
}
function createRoute(a,b,planeId){
  if(S.routes.some(r=>(r.a===a&&r.b===b)||(r.a===b&&r.b===a))) return sfxNo();
  const r={id:S.nextRoute++,a,b,d:distOf(a,b),planes:[]};
  S.routes.push(r);
  const p=planeById(planeId); if(p){ p.route=r.id; r.planes.push(p.id); }
  S.sel=null; S.tab="network"; sfxBuy(); closeModal();
  say("NEW ROUTE",a+" \u21c4 "+b+" is now flying.");
  saveGame(); render();
}
function borrow(n){ n=Math.round(n); if(n<=0) return sfxNo(); S.loan+=n; S.cash+=n; sfxTap(); saveGame(); render(); }
function repay(){ const n=Math.min(S.cash,S.loan); if(n<=0) return sfxNo(); S.loan-=n; S.cash-=n; sfxTap(); saveGame(); render(); }
function setCabin(k,v){ S[k]=+v; sfxTap(); saveGame(); render(); }

/* ---------- trivia gate ---------- */
let QUIZ=null;
function modalQuiz(code){
  const a=AP[code];
  if(S.quizzed.includes(code)) return doOpen(code);
  const order=[0,1,2];
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  QUIZ={code,order,right:order.indexOf(a.ans),done:false};
  drawQuiz();
}
function drawQuiz(msg){
  const a=AP[QUIZ.code];
  let h=`<h3>${esc(a.name)}</h3><p>Answer this and the base is yours for ${fmt$(baseCostFor(QUIZ.code))}.</p>
    <div class="quiz"><div class="q">${esc(a.q)}</div>`;
  QUIZ.order.forEach((oi,i)=>{
    let cls="ans";
    if(QUIZ.done){ if(oi===a.ans) cls+=" right"; else if(i===QUIZ.picked) cls+=" wrong"; }
    h+=`<button class="${cls}" ${QUIZ.done?"":`onclick="answerQuiz(${i})"`}>${esc(a.opts[oi])}</button>`;
  });
  if(QUIZ.done) h+=`<div class="why">${msg}</div>`;
  h+=`</div>`;
  if(QUIZ.done&&QUIZ.won) h+=`<button class="btn wide" onclick="quizPassed()">Open the base \u2192</button>`;
  else if(QUIZ.done) h+=`<button class="btn wide" onclick="modalQuizRetry()">Now you know \u2014 try again</button>`;
  h+=`<button class="btn ghost wide" onclick="closeModal()">Maybe later</button>`;
  showModal(h,true);
}
function answerQuiz(i){
  const a=AP[QUIZ.code];
  QUIZ.picked=i; QUIZ.done=true; QUIZ.won=(QUIZ.order[i]===a.ans);
  if(QUIZ.won){ sfxRight(); drawQuiz("Correct. "+esc(a.fact)); }
  else{ sfxWrong(); drawQuiz("Not quite \u2014 the green one is right. "+esc(a.fact)); }
}
function modalQuizRetry(){ QUIZ.done=false; QUIZ.won=false; QUIZ.picked=-1; drawQuiz(); }
function quizPassed(){
  const code=QUIZ.code,from=QUIZ.from;
  if(!S.quizzed.includes(code)) S.quizzed.push(code);
  closeModal(); doOpen(code,from);
}
function doOpen(code,from){
  openBase(code);
  if(from&&S.owned.includes(code)) modalRoute(from,code);
}

    h+=`<div class="card"><div class="row"><div><div class="ttl">${PL[p.type].name}</div>

    ${row(fmtN(sc.planes)+" aircraft","+"+sc.fleetPts.toLocaleString())}
    ${row(fmtN(sc.routes)+" routes","+"+sc.routePts.toLocaleString())}
    ${row("Subtotal",sc.base.toLocaleString())}
    ${row("Speed bonus &nbsp;(finished day "+fmtN(sc.days)+")","\u00d7"+sc.speed.toFixed(2),
          sc.speed>=1.5?"pos":sc.speed<1?"warn":"")}
    <div class="row" style="margin-top:10px"><span class="ttl">Final score</span>
      <span class="num" style="color:var(--gold);font-size:16px">${sc.total.toLocaleString()}</span></div>
    <div class="sub" style="margin-top:8px">Finish faster and the speed bonus multiplies everything. Under day 800 doubles it.</div>`;
  if(hist.length>1){
    h+=`<h2 class="sec">Your best runs</h2>`;
    hist.slice(0,6).forEach((r,i)=>{
      const mine=r.score===sc.total&&r.days===sc.days;
      h+=`<div class="card${mine?" sel":""}"><div class="row">
        <span class="ttl">${i+1}. ${r.score.toLocaleString()}</span>
        <span class="sub">${mine?"<span class='warn'>this run</span>":esc(r.rank)}</span></div>
        <div class="row"><span class="sub">day ${fmtN(r.days)} \u00b7 ${fmtN(r.planes)} planes \u00b7 ${fmtN(r.routes)} routes</span>
        <span class="sub">${fmt$(r.nw)}</span></div></div>`;

    h+=`<div class="sub" style="margin-top:14px;text-align:center">Play again to beat this score.</div>`;
  }

      <button class="btn ghost wide" onclick="wipeSave();modalStart()">Start a new airline</button>`;
  showModal(h,true);
}

/* ===================================================================
   INPUT — tap, drag to pan, pinch / wheel to zoom
   =================================================================== */
function hitTest(mx,my){
  let best=null,bd=1e9;
  for(const a of stageAirports()){
    const [x,y]=lonLatXY(a.lon,a.lat);
    const d=Math.hypot(x-mx,y-my);
    if(d<bd){bd=d;best=a;}
  }
  return best&&bd<=Math.max(15,7+best.size*1.4)?best.code:null;
}
const rectPt=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; };
const ptrs=new Map();
let dragged=false,lastPinch=0,panFrom=null;

cv.addEventListener("pointerdown",e=>{
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,rectPt(e));
  dragged=false;
  if(ptrs.size===1) panFrom=rectPt(e);
  if(ptrs.size===2){ const p=[...ptrs.values()]; lastPinch=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]); }
});
cv.addEventListener("pointermove",e=>{
  const p=rectPt(e);
  if(!ptrs.has(e.pointerId)){ hover=hitTest(p[0],p[1]); cv.style.cursor=hover?"pointer":"grab"; return; }
  ptrs.set(e.pointerId,p);
  if(ptrs.size>=2){
    const q=[...ptrs.values()],d=Math.hypot(q[0][0]-q[1][0],q[0][1]-q[1][1]);
    if(lastPinch>0&&d>0){ zoomAt((q[0][0]+q[1][0])/2,(q[0][1]+q[1][1])/2,d/lastPinch); dragged=true; }
    lastPinch=d;
  }else if(panFrom){
    const dx=p[0]-panFrom[0],dy=p[1]-panFrom[1];
    if(Math.abs(dx)>7||Math.abs(dy)>7) dragged=true;
    if(dragged){ S.view.px+=dx; S.view.py+=dy; clampPan(); panFrom=p; }
  }
});
function endPtr(e){
  const had=ptrs.has(e.pointerId);
  ptrs.delete(e.pointerId);
  if(ptrs.size<2) lastPinch=0;
  if(ptrs.size===0){ panFrom=null; if(had&&!dragged) tapMap(rectPt(e)); }
}
cv.addEventListener("pointerup",endPtr);
cv.addEventListener("pointercancel",e=>{ptrs.delete(e.pointerId);panFrom=null;lastPinch=0;});
cv.addEventListener("pointerleave",()=>{hover=null;});
cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=rectPt(e); zoomAt(p[0],p[1],e.deltaY<0?1.14:1/1.14); },{passive:false});

function tapMap([x,y]){
  const code=hitTest(x,y);
  if(!code){ if(S.sel){S.sel=null;render();} return; }
  sfxTap();
  const owned=S.owned.includes(code);
  if(S.sel===code){ S.sel=null; render(); return; }
  if(S.sel&&S.owned.includes(S.sel)){
    const from=S.sel;
    if(owned){
      const ex=S.routes.find(r=>(r.a===from&&r.b===code)||(r.a===code&&r.b===from));
      S.sel=null; S.tab="network"; render();
      if(ex) say("ROUTE","You already fly "+from+" \u21c4 "+code+".");
      else modalRoute(from,code);
    }else{ S.sel=null; render(); modalNewBase(from,code); }
    return;
  }
  S.sel=code; S.tab="network"; render();
}

document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; S.tab=b.dataset.tab; sfxTap(); render();
});
document.getElementById("speed").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const sp=+b.dataset.sp;
  if(sp===0) S.running=false; else { S.running=true; S.speed=sp; }
  sfxTap(); render();
});
const zc=(f)=>{ zoomAt(VIEW.w/2,VIEW.h/2,f); sfxTap(); };
document.getElementById("bZoomIn").onclick=()=>zc(1.35);
document.getElementById("bZoomOut").onclick=()=>zc(1/1.35);
document.getElementById("bFit").onclick=()=>{ resetView(); sfxTap(); };
document.getElementById("bFull").onclick=()=>{
  document.body.classList.toggle("mapfull");
  document.getElementById("bFull").innerHTML=document.body.classList.contains("mapfull")?"&#10529;":"&#10530;";

};
window.addEventListener("resize",()=>fitView());
window.addEventListener("keydown",e=>{
  if(e.key===" "){ e.preventDefault(); S.running=!S.running; render(); }
  if(e.key==="+"||e.key==="=") zc(1.35);
  if(e.key==="-") zc(1/1.35);
  if(e.key==="0") resetView();
});
window.addEventListener("pagehide",saveGame);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) saveGame(); });

/* ===================================================================
   MAIN LOOP
   =================================================================== */
let acc=0,last=0;
function frame(ts){
  if(!last) last=ts;
  const dt=Math.min(250,ts-last); last=ts;
  if(S&&S.running){
    acc+=dt;
    const step=DAY_MS[S.speed]||1050;
    let n=0;
    while(acc>=step&&n++<6){ acc-=step; tickDay(); }
    if(n) render();
  }
  if(S) loopDraw();
  requestAnimationFrame(frame);
}
/* boot */
(function boot(){
  const sv=loadSave();
  if(sv){ S=sv; S.running=false; S.sel=null; fitView(); render(); modalContinue(sv); }
  else{ newGame(STARTERS[0]); S.running=false; fitView(); render(); modalStart(); }
  requestAnimationFrame(()=>{ fitView(); draw(); });
  requestAnimationFrame(frame);
})();
