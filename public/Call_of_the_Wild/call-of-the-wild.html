<title>Call of the Wild!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">

<canvas id="game" width="960" height="540"></canvas>
<div id="dev">&gt; <input id="devin" autocomplete="off" spellcheck="false"> <span id="devout">god, win, boss, lvl &lt;k&gt; &lt;n&gt;, unlock, hp, reset</span></div>
<script>window.__ART = window.__ART || {};</script>
<script>// CALL OF THE WILD - core game logic (no DOM). Shared by the game, sim.js and tests.
(function (root) {
'use strict';
const W = 960, H = 540, DT = 1 / 60;

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// ---------------- DESIGN DATA (locked with Devin) ----------------
const KINGDOMS = {
  sea:  { id: 'sea',  name: 'Sea Kingdom',  hero: 'piranha', heroName: 'Piranha', ink: '#ff7a1a', ink2: '#ffd21a',
          enemies: ['jelly_bot', 'robo_shark', 'mine_bot'], unlock: [1, 2, 4],
          mini: { name: 'Captain Clank', spr: 'boss_sea_mini' }, big: { name: 'Mega-Fin 3000', spr: 'boss_sea_big' },
          captive: 'turtle', story: 'Robot sharks have invaded the Sea Kingdom! Chomp them to bits and free the sea creatures!' },
  land: { id: 'land', name: 'Land Kingdom', hero: 'wolf', heroName: 'Wolf', ink: '#8dff1f', ink2: '#19e3c9',
          enemies: ['hunter_bot', 'robo_hound', 'drone'], unlock: [1, 2, 4],
          mini: { name: 'Sergeant Sprocket', spr: 'boss_land_mini' }, big: { name: 'Iron Grizzly', spr: 'boss_land_big' },
          captive: 'bunny', story: 'Robot hunters are stomping through the Land Kingdom! Run, jump and chomp to save the forest!' },
  air:  { id: 'air',  name: 'Air Kingdom',  hero: 'hawk', heroName: 'Hawk', ink: '#ff2fa8', ink2: '#a35bff',
          enemies: ['drone_bird', 'buzz_saw', 'storm_blimp'], unlock: [1, 2, 4],
          mini: { name: 'Twin Rotor', spr: 'boss_air_mini' }, big: { name: 'Thunder Fortress', spr: 'boss_air_big' },
          captive: 'songbird', story: 'Robot drones have taken over the skies! Dive, swoop and chomp to save the Air Kingdom!' }
};
const CYCLE = ['sea', 'land', 'air'];
const HERO_KINGDOM = { piranha: 'sea', wolf: 'land', hawk: 'air' };
function orderFrom(hero) { const i = CYCLE.indexOf(HERO_KINGDOM[hero]); return [0, 1, 2].map(j => CYCLE[(i + j) % 3]); }
const LEVELS = 12, MINI_AT = 6, BIG_AT = 12;

const ED = {
  jelly_bot:   { hp: 1, spd: 55,  r: 24, beh: 'drift', pts: 10, w: 1 },
  robo_shark:  { hp: 2, spd: 150, r: 30, beh: 'chase', pts: 20, w: 0.8 },
  mine_bot:    { hp: 1, spd: 0,   r: 22, beh: 'bob',   pts: 10, w: 0.5 },
  hunter_bot:  { hp: 2, spd: 95,  r: 30, beh: 'walk',  pts: 20, w: 1 },
  robo_hound:  { hp: 1, spd: 210, r: 24, beh: 'run',   pts: 15, w: 0.8 },
  drone:       { hp: 1, spd: 70,  r: 24, beh: 'hover_shoot', pts: 15, w: 0.5 },
  drone_bird:  { hp: 1, spd: 90,  r: 24, beh: 'drift', pts: 10, w: 1 },
  buzz_saw:    { hp: 2, spd: 160, r: 26, beh: 'chase', pts: 20, w: 0.7 },
  storm_blimp: { hp: 3, spd: 40,  r: 42, beh: 'hover_shoot', pts: 40, w: 0.3 }
};

const P = { r: 26, maxHp: 6, BITE_T: 0.22, BITE_CD: 0.32, BITE_R: 52, INV: 1.3 };

// ---------------- TERRAIN + LEVELS ----------------
function makeTerrain(k, rng) {
  const p1 = rng() * 6.283, p2 = rng() * 6.283;
  if (k === 'sea') return { base: 482, a1: 24, f1: 0.0042, p1, a2: 10, f2: 0.011, p2 };
  if (k === 'land') return { base: 442, a1: 42, f1: 0.0031, p1, a2: 14, f2: 0.009, p2 };
  return { base: 476, a1: 66, f1: 0.0026, p1, a2: 18, f2: 0.0071, p2 };
}
function groundAt(T, x, flatFrom) {
  let y = T.base + T.a1 * Math.sin(x * T.f1 + T.p1) + T.a2 * Math.sin(x * T.f2 + T.p2);
  if (x > flatFrom) { const b = Math.min(1, (x - flatFrom) / 300); y = y * (1 - b) + T.base * b; }
  if (x < 200) { const b = Math.max(0, x / 200); y = y * b + T.base * (1 - b); }
  return y;
}

function pickType(types, rng) {
  let tot = 0; for (const t of types) tot += ED[t].w;
  let r = rng() * tot; for (const t of types) { r -= ED[t].w; if (r <= 0) return t; }
  return types[0];
}

function genLevel(k, n) {
  const seed = hashStr(k + ':' + n);
  const rng = mulberry32(seed);
  const T = makeTerrain(k, rng);
  const K = KINGDOMS[k];
  const isBoss = n === MINI_AT ? 'mini' : n === BIG_AT ? 'big' : null;
  const L = Math.round((3600 + n * 260) * (k === 'air' ? 1.8 : 1));
  const flatFrom = L - 350;
  const gy = x => groundAt(T, x, flatFrom);
  const types = K.enemies.filter((t, i) => n >= K.unlock[i]);
  const enemies = [], gears = [], food = [];
  const packs = 5 + Math.floor(n * 0.6);
  const span = L - 1000;
  let id = 0;
  for (let i = 0; i < packs; i++) {
    const cx = 700 + span * (i + 0.5) / packs + (rng() - 0.5) * 140;
    const size = 3 + Math.floor(rng() * (2 + n * 0.35));
    const lane = rng();
    for (let j = 0; j < size; j++) {
      const t = pickType(types, rng);
      const d = ED[t];
      const x = Math.round(cx + (j - size / 2) * 58 + (rng() - 0.5) * 30);
      let y;
      if (k === 'land') {
        if (d.beh === 'hover_shoot') y = gy(x) - 160 - rng() * 70;
        else y = gy(x) - d.r;
      } else {
        const top = k === 'sea' ? 130 : 100, bot = gy(x) - d.r - 30;
        const base = top + (bot - top) * lane;
        y = clamp(base + (rng() - 0.5) * 140, top, bot);
      }
      enemies.push({ id: id++, t, x, y: Math.round(y), ph: rng() * 6.28 });
    }
  }
  for (let x = 450; x < L - 150; x += 300 + Math.floor(rng() * 120)) {
    const arc = rng();
    for (let j = 0; j < 5; j++) {
      const gx = x + j * 34;
      let gyv;
      if (k === 'land') gyv = gy(gx) - 70 - Math.sin(j / 4 * Math.PI) * 60 * arc;
      else gyv = clamp(140 + arc * (gy(gx) - 230), 110, gy(gx) - 50) - Math.sin(j / 4 * Math.PI) * 40;
      gears.push({ x: gx, y: Math.round(gyv) });
    }
  }
  for (const f of [0.2, 0.38, 0.56, 0.74, 0.9]) {
    const fx = Math.round(L * f);
    const fy = k === 'land' ? gy(fx) - 40 : clamp(gy(fx) - 130, 120, 400);
    food.push({ x: fx, y: Math.round(fy) });
  }
  return { k, n, seed, T, L, flatFrom, isBoss, enemies, gears, food, cps: [Math.round(L / 3), Math.round(L * 2 / 3)], gateX: L + 700 };
}

// ---------------- GAME STATE ----------------
function makePlayer(G, x) {
  const k = G.k, gy = G.gy;
  const y = k === 'land' ? gy(x) - P.r : k === 'sea' ? 260 : 220;
  return { x, y, vx: 0, vy: 0, r: P.r, face: 1, hp: P.maxHp, maxHp: P.maxHp, inv: 1.0, biteT: 0, biteCD: 0, bitten: new Set(),
           onGround: k === 'land', jumps: 0, ang: 0, spd: 260, hurtT: 0 };
}
function instEnemy(s, lvMul) {
  const d = ED[s.t];
  return { id: s.id, t: s.t, beh: d.beh, x: s.x, y: s.y, y0: s.y, vx: 0, vy: 0, kx: 0, ky: 0, r: d.r, hp: d.hp, maxHp: d.hp,
           spd: d.spd * lvMul, pts: d.pts, ph: s.ph, t0: 0, active: false, dead: false, flash: 0, face: -1, cd: 1.2 + (s.ph % 1.5), hop: 1 + (s.ph % 2), onGround: true };
}
function newGame(k, n, opts) {
  opts = opts || {};
  const lv = genLevel(k, n);
  const G = { k, n, lv, t: 0, cam: 0, enemies: [], orbs: [], events: [], gearsGot: new Set(), foodGot: new Set(), gears: 0, chomps: 0, score: 0,
              deaths: 0, hits: 0, combo: 0, comboT: 0, bestCombo: 0, cpIdx: -1, arena: false, boss: null, done: false, doneT: 0,
              dm: 1, god: !!opts.god, nextId: 100000 };
  G.gy = x => groundAt(lv.T, x, lv.flatFrom);
  G.lvMul = 0.85 + n * 0.025;
  G.p = makePlayer(G, 120);
  G.enemies = lv.enemies.map(s => instEnemy(s, G.lvMul));
  return G;
}
const dmSpeed = G => 0.7 + 0.3 * G.dm;
const mode = G => G.k === 'sea' ? 'swim' : G.k === 'land' ? 'run' : (G.arena ? 'free' : 'glide');

function ev(G, t, o) { const e = Object.assign({ t }, o || {}); G.events.push(e); return e; }

// ---------------- PLAYER ----------------
function stepPlayer(G, inp, dt) {
  const p = G.p, lv = G.lv, m = mode(G);
  p.inv = Math.max(0, p.inv - dt); p.biteCD = Math.max(0, p.biteCD - dt); p.hurtT = Math.max(0, p.hurtT - dt);
  if (p.biteT > 0) p.biteT -= dt;
  const ax = (inp.r ? 1 : 0) - (inp.l ? 1 : 0), ay = (inp.d ? 1 : 0) - (inp.u ? 1 : 0);
  if (inp.biteP && p.biteCD <= 0) {
    p.biteT = P.BITE_T; p.biteCD = P.BITE_CD; p.bitten = new Set();
    if (m === 'glide') p.spd += 140;
    else { p.vx += p.face * (m === 'run' ? 230 : 280); }
    ev(G, 'bite', { x: p.x, y: p.y });
  }
  if (m === 'swim' || m === 'free') {
    const acc = 1500, mx = (p.biteT > 0 ? 560 : (m === 'free' ? 340 : 310));
    p.vx += ax * acc * dt; p.vy += ay * acc * dt;
    const damp = Math.pow(0.06, dt);
    if (!ax) p.vx *= damp; if (!ay) p.vy *= damp;
    const sp = Math.hypot(p.vx, p.vy); if (sp > mx) { p.vx *= mx / sp; p.vy *= mx / sp; }
    if (ax) p.face = ax;
    p.x += p.vx * dt; p.y += p.vy * dt;
    const top = m === 'swim' ? 96 : 56, bot = G.gy(p.x) - p.r;
    if (p.y < top) { p.y = top; p.vy = Math.max(0, p.vy); }
    if (p.y > bot) { p.y = bot; p.vy = Math.min(0, p.vy); }
    p.ang = clamp(p.vy / 600, -0.5, 0.5) * p.face;
  } else if (m === 'run') {
    if (ax) { p.vx += ax * 2100 * dt; p.face = ax; }
    else p.vx *= Math.pow(p.onGround ? 0.003 : 0.35, dt);
    const mx = p.biteT > 0 ? 540 : 320; p.vx = clamp(p.vx, -mx, mx);
    if (inp.upP) {
      if (p.onGround) { p.vy = -720; p.onGround = false; p.jumps = 1; ev(G, 'jump'); }
      else if (p.jumps < 2) { p.vy = -620; p.jumps = 2; ev(G, 'jump'); }
    }
    if (!inp.u && p.vy < -300) p.vy += 2600 * dt;
    p.vy += 1800 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    const g = G.gy(p.x);
    if (p.y + p.r >= g) { p.y = g - p.r; if (p.vy > 0) p.vy = 0; if (!p.onGround) ev(G, 'land'); p.onGround = true; p.jumps = 0; }
    else if (p.onGround && p.vy >= 0 && g - (p.y + p.r) < 16) { p.y = g - p.r; }
    else p.onGround = false;
    p.ang = 0;
  } else { // glide: Tiny Wings style swoop
    p.face = 1;
    const tgt = inp.d ? 1.15 : inp.u ? -0.85 : (p.spd > 330 ? -0.18 : 0.22);
    p.ang += clamp(tgt - p.ang, -3.6 * dt, 3.6 * dt);
    const thrust = (inp.r ? 170 : 0) - (inp.l ? 230 : 0) + (inp.u ? 340 : 0);
    p.spd += (560 * Math.sin(p.ang) + thrust + (270 - p.spd) * 0.8) * dt;
    if (p.biteT <= 0) p.spd = clamp(p.spd, 170, 640); else p.spd = clamp(p.spd, 170, 760);
    p.vx = p.spd * Math.cos(p.ang); p.vy = p.spd * Math.sin(p.ang);
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.y < 56) { p.y = 56; if (p.ang < 0) p.ang = 0; }
    const g = G.gy(p.x);
    if (p.y + p.r > g) { p.y = g - p.r; if (p.ang > 0) { p.ang = -p.ang * 0.6; p.spd *= 0.93; ev(G, 'skim', { x: p.x, y: g }); } }
  }
  // horizontal bounds
  let minX = 30, maxX = lv.isBoss ? lv.L + W - 30 : lv.gateX + 60;
  if (G.arena) { minX = lv.L + 34; maxX = lv.L + W - 34; }
  if (p.x < minX) { p.x = minX; p.vx = Math.max(0, p.vx); }
  if (p.x > maxX) { p.x = maxX; p.vx = Math.min(0, p.vx); if (m === 'glide') p.spd = 200; }
}

function hurtPlayer(G, fromX) {
  const p = G.p;
  if (p.inv > 0 || G.done) return;
  G.hits++;
  if (G.god) { p.inv = 0.5; return; }
  p.hp--; p.inv = P.INV; p.hurtT = 0.4;
  const dir = p.x < fromX ? -1 : 1;
  if (mode(G) === 'glide') { p.ang = -0.5; p.spd = Math.max(200, p.spd * 0.8); }
  else { p.vx = dir * 300; p.vy = mode(G) === 'run' ? -380 : (p.vy - 120); p.onGround = false; }
  G.combo = 0;
  ev(G, 'hurt', { x: p.x, y: p.y });
  if (p.hp <= 0) defeat(G);
}

function defeat(G) {
  G.deaths++;
  G.dm = Math.max(0.45, 1 - 0.15 * G.deaths);
  ev(G, 'ko', { x: G.p.x, y: G.p.y });
  const lv = G.lv;
  const rx = G.arena ? lv.L + 120 : (G.cpIdx >= 0 ? lv.cps[G.cpIdx] : 120);
  G.p = makePlayer(G, rx); G.p.inv = 2.0;
  G.orbs = [];
  const keep = mulberry32(lv.seed + G.deaths * 7919);
  if (G.arena) {
    G.enemies = [];
    const b = G.boss; const base = b.big ? 22 : 12;
    b.maxHp = Math.max(6, Math.round(base * G.dm)); b.hp = Math.min(b.hp + 4, b.maxHp);
    b.state = 'idle'; b.t = 1.6; b.x = lv.L + W - 170; b.vx = 0;
  } else {
    G.enemies = lv.enemies.filter(s => s.x > rx + 260 && keep() < G.dm).map(s => instEnemy(s, G.lvMul));
  }
  G.cam = Math.max(0, rx - 300);
}

// ---------------- ENEMIES ----------------
function shoot(G, x, y, tx, ty, spd) {
  const d = Math.hypot(tx - x, ty - y) || 1;
  G.orbs.push({ id: G.nextId++, x, y, vx: (tx - x) / d * spd, vy: (ty - y) / d * spd, r: 11, life: 4.5 });
  ev(G, 'zap', { x, y });
}
function stepEnemies(G, dt) {
  const p = G.p, ds = dmSpeed(G), camR = G.cam + W + 160, isLand = G.k === 'land';
  for (const e of G.enemies) {
    if (!e.active) { if (e.x < camR) e.active = true; else continue; }
    e.t0 += dt; e.flash = Math.max(0, e.flash - dt);
    const sp = e.spd * ds, dx = p.x - e.x, dy = p.y - e.y;
    switch (e.beh) {
      case 'chase': {
        const d = Math.hypot(dx, dy) || 1;
        if (d < 640) { e.vx += (dx / d * sp - e.vx) * 2.2 * dt; e.vy += (dy / d * sp - e.vy) * 2.2 * dt; }
        else { e.vx += (-sp * 0.3 - e.vx) * dt; e.vy *= 0.98; }
        e.x += e.vx * dt; e.y += e.vy * dt; e.face = e.vx < 0 ? -1 : 1; break;
      }
      case 'drift': e.x -= sp * dt; e.y0 += clamp(dy, -1, 1) * 8 * dt; e.y = e.y0 + Math.sin(e.t0 * 2.2 + e.ph) * 32; e.face = -1; break;
      case 'bob': e.y = e.y0 + Math.sin(e.t0 * 1.7 + e.ph) * 16; e.face = dx < 0 ? -1 : 1; break;
      case 'walk': case 'run': {
        if (e.beh === 'walk') { if (Math.abs(dx) < 720) e.vx += (Math.sign(dx) * sp - e.vx) * 3 * dt; e.face = dx < 0 ? -1 : 1; }
        else { if (Math.abs(dx) < 900 || e.t0 > 0.1) e.vx = -sp; e.face = -1; }
        e.hop -= dt;
        if (e.onGround && e.hop <= 0 && e.beh === 'walk') { e.vy = -420; e.onGround = false; e.hop = 1.6 + (e.ph % 1.4); }
        e.vy += 1600 * dt; e.x += e.vx * dt; e.y += e.vy * dt;
        const g = G.gy(e.x);
        if (e.y + e.r >= g) { e.y = g - e.r; e.vy = 0; e.onGround = true; }
        break;
      }
      case 'hover_shoot': {
        const want = p.x + 260 * Math.sign(e.x - p.x || 1);
        e.x += clamp(want - e.x, -sp, sp) * dt;
        e.y = e.y0 + Math.sin(e.t0 * 1.8 + e.ph) * 22; e.face = dx < 0 ? -1 : 1;
        e.cd -= dt * ds;
        if (e.cd <= 0 && Math.abs(dx) < 560) { shoot(G, e.x + e.face * e.r, e.y, p.x, p.y, 170 * ds); e.cd = e.t === 'storm_blimp' ? 2.4 : 3.0; }
        break;
      }
    }
    e.x += e.kx * dt; e.y += e.ky * dt; e.kx *= Math.pow(0.02, dt); e.ky *= Math.pow(0.02, dt);
    if (!isLand || e.beh === 'hover_shoot') {
      const top = G.k === 'sea' ? 100 : 60;
      e.y = clamp(e.y, top, G.gy(e.x) - e.r); e.y0 = clamp(e.y0, top, G.gy(e.x) - e.r);
    }
    if (G.arena) e.x = clamp(e.x, G.lv.L + 30, G.lv.L + W - 30);
  }
  G.enemies = G.enemies.filter(e => !e.dead && e.x > G.cam - 450);
  for (const o of G.orbs) { o.x += o.vx * dt; o.y += o.vy * dt; o.life -= dt; if (o.y > G.gy(o.x)) o.life = 0; }
  G.orbs = G.orbs.filter(o => o.life > 0 && !o.dead);
}

function hurtEnemy(G, e, dmg) {
  const p = G.p;
  e.hp -= dmg; e.flash = 0.15; e.kx = p.face * 240; e.ky = -60;
  ev(G, 'hit', { x: e.x, y: e.y });
  if (e.hp <= 0) {
    e.dead = true; G.chomps++;
    G.combo = G.comboT > 0 ? G.combo + 1 : 1; G.comboT = 1.6; G.bestCombo = Math.max(G.bestCombo, G.combo);
    G.score += e.pts * Math.min(5, G.combo);
    ev(G, 'splat', { x: e.x, y: e.y, r: e.r, combo: G.combo, ty: e.t });
  }
}

// ---------------- BOSS ----------------
function spawnBoss(G) {
  const lv = G.lv, big = lv.isBoss === 'big', K = KINGDOMS[G.k];
  const r = big ? 78 : 58, base = big ? 22 : 12;
  const hp = Math.max(6, Math.round(base * G.dm));
  const x = lv.L + W - 170;
  const y = G.k === 'land' ? G.gy(x) - r : 270;
  const info = big ? K.big : K.mini;
  G.boss = { name: info.name, spr: info.spr, big, r, hp, maxHp: hp, x, y, vx: 0, vy: 0, state: 'intro', t: 2.0, inv: 0, flash: 0, face: -1, seq: 0, cy: y, deadT: 0 };
  ev(G, 'bossIntro', { name: info.name });
}
function stepBoss(G, dt) {
  const b = G.boss; if (!b) return;
  const p = G.p, lv = G.lv, land = G.k === 'land';

  air: { sky: ['#4aa8ff', '#ffaee0', '#ffe2a8'], top: '#fff3b0', lip: '#ff9a3c', body: ['#ff6fb5', '#a83aff'], far: '#ffffff', mid: '#ffd0f0' }

function drawSky(ctx, k, cam, time) {

    farLayer(ctx, cam, 0.06, 330, (x, i) => { const y = 60 + hsh(i) * 80; for (let j = 0; j < 4; j++) { ell(ctx, x + j * 30, y - (j % 2) * 14, 34, 22); ctx.fill(); } });
    farLayer(ctx, cam, 0.18, 300, (x, i) => { const h = 150 + hsh(i) * 110; ctx.beginPath(); ctx.moveTo(x - 200, H - 90); ctx.lineTo(x, H - 90 - h); ctx.lineTo(x + 200, H - 90); ctx.closePath(); ctx.fillStyle = th.far; ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - 40, H - 90 - h * 0.8); ctx.lineTo(x, H - 90 - h); ctx.lineTo(x + 40, H - 90 - h * 0.8); ctx.lineTo(x + 14, H - 90 - h * 0.75); ctx.lineTo(x, H - 90 - h * 0.82); ctx.lineTo(x - 14, H - 90 - h * 0.75); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill(); });
    farLayer(ctx, cam, 0.42, 220, (x, i) => { ctx.fillStyle = th.mid; ell(ctx, x, H - 90, 150, 70 + hsh(i) * 40); ctx.fill();
      if (hsh(i + 3) > 0.4) { const tx = x + (hsh(i + 5) - 0.5) * 100, ty = H - 150 - hsh(i) * 30; ctx.fillStyle = '#7a3a1f'; ctx.fillRect(tx - 5, ty, 10, 40); ctx.fillStyle = '#1fa85a'; ell(ctx, tx, ty - 4, 26, 30); ctx.fill(); } });
  } else {
    farLayer(ctx, cam, 0.05, 280, (x, i) => { const y = 80 + hsh(i) * 120; ctx.fillStyle = 'rgba(255,255,255,.75)'; for (let j = 0; j < 5; j++) { ell(ctx, x + j * 26, y - (j % 2) * 16, 30, 20); ctx.fill(); } });

}
function farLayer(ctx, cam, par, spacing, fn) {
  const off = cam * par; const i0 = Math.floor((off - 300) / spacing), i1 = Math.ceil((off + W + 300) / spacing);
  for (let i = i0; i <= i1; i++) fn(i * spacing - off, i);
}

function drawTerrain(ctx, G, cam, decals) {
  const k = G.k, th = THEME[k], gy = G.gy, step = 12;
  const pts = []; for (let sx = -step; sx <= W + step; sx += step) pts.push([sx, gy(sx + cam)]);
  // top face (pseudo 3D lip)
  ctx.beginPath(); ctx.moveTo(pts[0][0], H); for (const [x, y] of pts) ctx.lineTo(x, y - 16); ctx.lineTo(pts[pts.length - 1][0], H); ctx.closePath();
  ctx.fillStyle = th.top; ctx.fill();
  // body
  ctx.save();
  ctx.beginPath(); ctx.moveTo(pts[0][0], H); for (const [x, y] of pts) ctx.lineTo(x, y); ctx.lineTo(pts[pts.length - 1][0], H); ctx.closePath();
  const g = ctx.createLinearGradient(0, 380, 0, H); g.addColorStop(0, th.body[0]); g.addColorStop(1, th.body[1]); ctx.fillStyle = g; ctx.fill();
  ctx.clip();
  if (k === 'air') { // Tiny Wings stripes
    const sw = 70; const off = cam % (sw * 2);
    ctx.globalAlpha = 0.35; ctx.fillStyle = '#fff';
    for (let x = -off - sw * 2; x < W + sw * 2; x += sw * 2) { ctx.beginPath(); ctx.moveTo(x, 360); ctx.lineTo(x + sw, 360); ctx.lineTo(x + sw - 120, H); ctx.lineTo(x - 120, H); ctx.closePath(); ctx.fill(); }
    ctx.globalAlpha = 1;
  } else {
    ctx.globalAlpha = 0.18; ctx.fillStyle = '#000';
    for (let i = Math.floor(cam / 90) - 1; i < (cam + W) / 90 + 1; i++) { const x = i * 90 - cam, y = gy(i * 90) + 30 + hsh(i) * 40; ell(ctx, x, y, 12 + hsh(i + 1) * 10, 6 + hsh(i + 2) * 4); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  // ink decals sit on the top face
  for (const d of decals) {
    const sx = d.x - cam; if (sx < -80 || sx > W + 80) continue;
    const y = gy(d.x) - 8;
    ctx.fillStyle = d.c; ctx.globalAlpha = 0.9;
    ell(ctx, sx, y, d.w, d.w * 0.28); ctx.fill();
    for (let j = 0; j < 4; j++) { ell(ctx, sx + (hsh(d.s + j) - 0.5) * d.w * 2.4, y + (hsh(d.s + j + 7) - 0.5) * 6, d.w * 0.18, d.w * 0.08); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  // lip edge
  ctx.beginPath(); for (const [x, y] of pts) ctx.lineTo(x, y); ctx.lineWidth = 5; ctx.strokeStyle = th.lip; ctx.stroke();
  ctx.beginPath(); for (const [x, y] of pts) ctx.lineTo(x, y - 16); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.stroke();
  // grass tufts / shells
  for (let i = Math.floor(cam / 70) - 1; i < (cam + W) / 70 + 1; i++) {
    const wx = i * 70 + hsh(i) * 40, x = wx - cam, y = gy(wx) - 14;
    if (k === 'land') { ctx.beginPath(); for (let j = -2; j <= 2; j++) { ctx.moveTo(x + j * 4, y + 4); ctx.lineTo(x + j * 6, y - 10 - hsh(i + j) * 6); } ctx.lineWidth = 3; ctx.strokeStyle = '#2fb84a'; ctx.stroke(); }
    else if (k === 'sea' && hsh(i) > 0.6) { ctx.fillStyle = '#ff9ab8'; ell(ctx, x, y + 2, 7, 4); ctx.fill(); }
    else if (k === 'air' && hsh(i) > 0.7) { ctx.fillStyle = '#fff'; ell(ctx, x, y, 5, 5); ctx.fill(); ctx.fillStyle = '#ffd21a'; ell(ctx, x, y, 2, 2); ctx.fill(); }
  }
}

function shadow(ctx, G, wx, wy, r, cam) {
  const g = G.gy(wx), h = Math.max(0, g - wy);
  const s = Math.max(0.25, 1 - h / 400);
  ctx.save(); ctx.globalAlpha = 0.28 * s; ctx.fillStyle = '#1d1033'; ell(ctx, wx - cam, g - 9, r * 1.1 * s, r * 0.28 * s); ctx.fill(); ctx.restore();
}

// ---------- FX ----------
R.makeFx = () => ({ parts: [], decals: [], pops: [], shake: 0, flash: 0, ambient: [], freeT: -1 });
R.handleEvents = (fx, G) => {
  const K = C.KINGDOMS[G.k];
  for (const e of G.events) {
    if (e.t === 'splat' || e.t === 'bossDown') {
      const big = e.t === 'bossDown', n = big ? 60 : 16;
      for (let i = 0; i < n; i++) { const a = Math.random() * TAU, s = 120 + Math.random() * (big ? 520 : 300);
        fx.parts.push({ x: e.x, y: e.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, r: 4 + Math.random() * (big ? 12 : 7), c: Math.random() < 0.65 ? K.ink : (Math.random() < 0.5 ? K.ink2 : '#c8d3e6'), life: 1.4, ink: true }); }
      fx.parts.push({ x: e.x, y: e.y, burst: true, r: (e.r || 30) * (big ? 2.4 : 1.5), c: K.ink, life: 0.35, max: 0.35 });
      if (!big) fx.pops.push({ x: e.x, y: e.y - 20, txt: e.combo >= 3 ? 'x' + e.combo + ' COMBO!' : ['CHOMP!', 'CRUNCH!', 'SNAP!'][Math.floor(Math.random() * 3)], life: 0.8, c: e.combo >= 3 ? K.ink2 : '#fff' });
      fx.shake = Math.max(fx.shake, big ? 18 : 4);
    } else if (e.t === 'hit' || e.t === 'bossHit') { for (let i = 0; i < 6; i++) fx.parts.push({ x: e.x, y: e.y, vx: (Math.random() - 0.5) * 300, vy: (Math.random() - 0.7) * 300, r: 3, c: '#fff6a0', life: 0.3 }); if (e.t === 'bossHit') { fx.shake = Math.max(fx.shake, 6); fx.pops.push({ x: e.x, y: e.y - 60, txt: e.dmg > 1 ? 'MEGA CHOMP!' : 'CHOMP!', life: 0.7, c: K.ink2 }); } }
    else if (e.t === 'hurt') { fx.shake = Math.max(fx.shake, 8); fx.flash = 0.25; }
    else if (e.t === 'thud') fx.shake = Math.max(fx.shake, 14);
    else if (e.t === 'gear') fx.pops.push({ x: e.x, y: e.y, txt: '+5', life: 0.5, c: '#ffd21a' });
    else if (e.t === 'food') fx.pops.push({ x: e.x, y: e.y, txt: '+♥', life: 0.8, c: '#ff4d6d' });
    else if (e.t === 'checkpoint') fx.pops.push({ x: e.x, y: 200, txt: 'CHECKPOINT!', life: 1.2, c: K.ink });
    else if (e.t === 'pop') for (let i = 0; i < 6; i++) fx.parts.push({ x: e.x, y: e.y, vx: (Math.random() - 0.5) * 200, vy: (Math.random() - 0.5) * 200, r: 3, c: '#7fe8ff', life: 0.3 });
    else if (e.t === 'ko') fx.flash = 0.6;
    else if (e.t === 'free') fx.freeT = 0;
  }
};
R.stepFx = (fx, G, dt) => {
  const grav = G.k === 'sea' ? 300 : 900;
  for (const p of fx.parts) {
    p.life -= dt; if (p.burst) continue;
    p.vy += grav * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.ink && p.y > G.gy(p.x) - 10) { p.life = 0; if (fx.decals.length > 180) fx.decals.shift(); if (Math.random() < 0.6) fx.decals.push({ x: p.x, w: p.r * 2.2, c: p.c, s: Math.floor(Math.random() * 999) }); }
  }
  fx.parts = fx.parts.filter(p => p.life > 0);
  for (const p of fx.pops) { p.life -= dt; p.y -= 50 * dt; }
  fx.pops = fx.pops.filter(p => p.life > 0);
  fx.shake *= Math.pow(0.0005, dt); fx.flash = Math.max(0, fx.flash - dt);
  if (fx.freeT >= 0) fx.freeT += dt;
  // ambient
  if (fx.ambient.length < 26) fx.ambient.push({ x: Math.random() * W, y: G.k === 'sea' ? H + 10 : Math.random() * H, s: 0.5 + Math.random(), ph: Math.random() * 6 });
  for (const a of fx.ambient) { if (G.k === 'sea') { a.y -= 40 * a.s * dt; if (a.y < 90) a.y = H + 10; } else { a.x -= (G.k === 'air' ? 140 : 40) * a.s * dt; a.y += Math.sin(a.ph += dt) * 0.3; if (a.x < -20) { a.x = W + 20; a.y = Math.random() * H; } } }
};

// ---------- MAIN DRAW ----------
R.drawGame = (ctx, G, fx, time) => {
  const k = G.k, K = C.KINGDOMS[k], lv = G.lv, p = G.p;
  const sh = fx.shake > 0.5 ? fx.shake : 0;
  const cam = G.cam + (Math.random() - 0.5) * sh;
  ctx.save(); ctx.translate(0, (Math.random() - 0.5) * sh);
  drawSky(ctx, k, cam, time);
  drawTerrain(ctx, G, cam, fx.decals);
  // checkpoints
  lv.cps.forEach((cx, i) => { const x = cx - cam; if (x < -60 || x > W + 60) return; const y = G.gy(cx) - 12, up = G.cpIdx >= i;
    ctx.fillStyle = '#5a2a14'; rr(ctx, x - 4, y - 90, 8, 92, 3); ctx.fill(); stroke(ctx, 2);
    const fy = up ? y - 88 : y - 30; ctx.beginPath(); ctx.moveTo(x + 4, fy); ctx.quadraticCurveTo(x + 30, fy + 6 + Math.sin(time * 6) * 4, x + 50, fy + 4); ctx.lineTo(x + 4, fy + 26); ctx.closePath(); ctx.fillStyle = up ? K.ink : '#c8c0d8'; ctx.fill(); stroke(ctx, 2.5); });
  // captive cage
  const cageX = lv.isBoss ? lv.L + W - 70 : lv.gateX;
  if (cageX - cam < W + 120) drawCage(ctx, G, cageX - cam, G.gy(cageX), time, fx);
  // pickups
  lv.gears.forEach((g, i) => { if (G.gearsGot.has(i)) return; const x = g.x - cam; if (x < -30 || x > W + 30) return; drawSprite(ctx, 'gear', x, g.y + Math.sin(time * 3 + i) * 4, 1, false, time + i); });
  lv.food.forEach((f, i) => { if (G.foodGot.has(i)) return; const x = f.x - cam; if (x < -40 || x > W + 40) return;
    ctx.save(); ctx.globalAlpha = 0.35 + Math.sin(time * 5) * 0.15; ctx.fillStyle = '#fff'; ell(ctx, x, f.y, 26, 26); ctx.fill(); ctx.restore();
    drawSprite(ctx, 'food_' + k, x, f.y + Math.sin(time * 2.5) * 5, 1, false, time); });
  // shadows
  for (const e of G.enemies) if (e.active) shadow(ctx, G, e.x, e.y, e.r, cam);
  if (G.boss) shadow(ctx, G, G.boss.x, G.boss.y, G.boss.r, cam);
  shadow(ctx, G, p.x, p.y, p.r, cam);
  // enemies
  for (const e of G.enemies) { if (!e.active) continue; const x = e.x - cam; if (x < -80 || x > W + 80) continue;
    drawSprite(ctx, e.t, x, e.y, 1, e.face > 0 ? false : true, e.t0 + e.ph, {}, 0);
    if (e.flash > 0) { ctx.save(); ctx.globalAlpha = 0.6; ctx.fillStyle = '#fff'; ell(ctx, x, e.y, e.r, e.r); ctx.fill(); ctx.restore(); }
    if (e.maxHp > 1 && e.hp < e.maxHp) { ctx.fillStyle = OUT; rr(ctx, x - 16, e.y - e.r - 14, 32, 6, 3); ctx.fill(); ctx.fillStyle = '#ff4d6d'; rr(ctx, x - 15, e.y - e.r - 13, 30 * e.hp / e.maxHp, 4, 2); ctx.fill(); } }
  // boss
  if (G.boss) drawBoss(ctx, G, cam, time);
  // orbs
  for (const o of G.orbs) { const x = o.x - cam; ctx.save(); ctx.shadowColor = '#7fe8ff'; ctx.shadowBlur = 14; ell(ctx, x, o.y, o.r, o.r); ctx.fillStyle = '#c9f7ff'; ctx.fill(); ctx.restore(); ell(ctx, x, o.y, o.r, o.r); stroke(ctx, 2); ell(ctx, x - 3, o.y - 3, 3, 3); ctx.fillStyle = '#fff'; ctx.fill(); }
  // player
  drawHero(ctx, G, p.x - cam, p.y, time);
  // particles
  for (const q of fx.parts) {
    const x = q.x - cam;
    if (q.burst) { const f = 1 - q.life / q.max; ctx.save(); ctx.globalAlpha = q.life / q.max; ctx.fillStyle = q.c; ctx.beginPath();
      for (let i = 0; i < 14; i++) { const a = i / 14 * TAU, rr2 = q.r * (0.5 + f * 0.8) * (i % 2 ? 1 : 0.7 + hsh(i) * 0.5); ctx.lineTo(x + Math.cos(a) * rr2, q.y + Math.sin(a) * rr2); } ctx.closePath(); ctx.fill(); ctx.restore(); continue; }
    ctx.fillStyle = q.c; ell(ctx, x, q.y, q.r, q.r); ctx.fill();
  }
  // ambient foreground
  ctx.save();
  for (const a of fx.ambient) {
    if (k === 'sea') { ctx.globalAlpha = 0.5; ell(ctx, a.x, a.y, 3 * a.s + 2, 3 * a.s + 2); ctx.strokeStyle = '#d9f6ff'; ctx.lineWidth = 1.5; ctx.stroke(); }
    else if (k === 'land') { ctx.globalAlpha = 0.8; ctx.fillStyle = '#7dff4a'; ell(ctx, a.x, a.y, 5, 2.5, a.ph); ctx.fill(); }
    else { ctx.globalAlpha = 0.5; ctx.fillStyle = '#fff'; rr(ctx, a.x, a.y, 40 * a.s, 3, 1.5); ctx.fill(); }
  }
  ctx.restore();
  if (k === 'sea') { // water surface
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.moveTo(0, 0); for (let x = 0; x <= W; x += 20) ctx.lineTo(x, 82 + Math.sin((x + cam) * 0.03 + time * 2) * 5); ctx.lineTo(W, 0); ctx.closePath(); ctx.fill();
    ctx.beginPath(); for (let x = 0; x <= W; x += 20) ctx.lineTo(x, 82 + Math.sin((x + cam) * 0.03 + time * 2) * 5); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.stroke();
  }
  // pops
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const q of fx.pops) { ctx.save(); ctx.globalAlpha = Math.min(1, q.life * 3); text(ctx, q.txt, q.x - cam, q.y, 26, q.c); ctx.restore(); }
  ctx.restore();
  if (fx.flash > 0) { ctx.fillStyle = 'rgba(255,60,90,' + Math.min(0.35, fx.flash) + ')'; ctx.fillRect(0, 0, W, H); }
};

function drawHero(ctx, G, x, y, time) {
  const p = G.p, K = C.KINGDOMS[G.k], m = C.mode(G);
  if (p.inv > 0 && Math.floor(time * 16) % 2 === 0 && p.hurtT <= 0 && p.inv < 1.9) { ctx.globalAlpha = 0.45; }
  const bite = p.biteT > 0 ? Math.sin((1 - p.biteT / C.P.BITE_T) * Math.PI) : 0;
  const moving = Math.abs(p.vx) > 30 || Math.abs(p.vy) > 30;
  const rot = m === 'glide' ? p.ang : (m === 'swim' || m === 'free') ? p.ang * 0.8 : 0;
  const key = K.hero;
  const yy = m === 'run' ? y - 8 : y;
  drawSprite(ctx, key, x, yy, 1.0, p.face < 0, time, { bite, moving, air: m === 'run' && !p.onGround, dive: m === 'glide' && p.ang > 0.6, up: p.vy < -100 }, rot);
  ctx.globalAlpha = 1;
  if (p.biteT > 0) { // chomp swoosh
    const bc = C.biteCenter(p); const bx = bc.x - (p.x - x);
    ctx.save(); ctx.globalAlpha = 0.85 * (p.biteT / C.P.BITE_T); ctx.lineWidth = 6; ctx.strokeStyle = '#fff';
    ctx.beginPath(); ctx.arc(bx, bc.y, 30, p.face > 0 ? -1.2 : Math.PI - 1.2 + 0.4, p.face > 0 ? 1.2 : Math.PI + 1.2 - 0.4); ctx.stroke();
    ctx.strokeStyle = K.ink; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(bx, bc.y, 38, p.face > 0 ? -0.9 : Math.PI - 0.9, p.face > 0 ? 0.9 : Math.PI + 0.9); ctx.stroke(); ctx.restore();
  }
}

function drawBoss(ctx, G, cam, time) {
  const b = G.boss, x = b.x - cam;
  let y = b.y, rot = 0;
  if (b.state === 'tele') { const s = Math.sin(time * 60) * 4; ctx.save(); ctx.translate(s, 0); }
  else ctx.save();
  if (b.state === 'dead') { ctx.globalAlpha = Math.max(0, 1 - b.deadT / 2); rot = b.deadT * 0.6; }
  if (b.state === 'dizzy') rot = Math.sin(time * 8) * 0.12;
  drawSprite(ctx, b.spr, x, y, 1, b.face < 0, time, { bite: b.state === 'charge' ? 1 : 0 }, rot);
  if (b.flash > 0) { ctx.globalAlpha = 0.55; ctx.fillStyle = '#fff'; ell(ctx, x, y, b.r, b.r * 0.8); ctx.fill(); }
  ctx.restore();
  if (b.state === 'tele') { ctx.save(); ctx.globalAlpha = 0.5 + Math.sin(time * 30) * 0.3; text(ctx, '!', x, y - b.r - 30, 54, '#ff3b3b'); ctx.restore(); }
  if (b.state === 'dizzy') for (let i = 0; i < 3; i++) { const a = time * 4 + i * TAU / 3; R.star(ctx, x + Math.cos(a) * b.r * 0.6, y - b.r - 10 + Math.sin(a) * 8, 11); }
}

function drawCage(ctx, G, x, gy, time, fx) {
  const K = C.KINGDOMS[G.k];
  const open = G.done ? Math.min(1, Math.max(0, fx.freeT) * 2) : 0;
  const hang = G.lv.isBoss && G.k !== 'land';
  if (hang) { gy = 190; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, gy - 134); ctx.lineWidth = 5; ctx.strokeStyle = '#3a4466'; ctx.stroke(); }
  const cy = gy - 70;
  ctx.fillStyle = '#5d6b8a'; rr(ctx, x - 56, gy - 16, 112, 18, 6); ctx.fill(); stroke(ctx, 3);
  // friend
  const hop = G.done ? -Math.abs(Math.sin(time * 6)) * 30 - open * 40 : Math.sin(time * 2) * 2;
  drawSprite(ctx, K.captive, x, cy + 20 + hop, 1.1, true, time);
  if (G.done) for (let i = 0; i < 4; i++) text(ctx, '♥', x + Math.sin(time * 2 + i) * 40, cy - 30 - ((time * 50 + i * 30) % 90), 22, '#ff4d6d');
  // bars lift up when freed
  ctx.save(); ctx.translate(0, -open * 140); ctx.globalAlpha = 1 - open * 0.6;
  for (let i = -2; i <= 2; i++) { rr(ctx, x + i * 20 - 4, cy - 50, 8, 104, 4); ctx.fillStyle = metal(ctx, x, cy, 60); ctx.fill(); stroke(ctx, 2); }
  rr(ctx, x - 56, cy - 64, 112, 18, 8); ctx.fillStyle = '#3a4466'; ctx.fill(); stroke(ctx, 3);
  roboEye(ctx, x, cy - 55, 5, '#ff2a2a');
  ctx.restore();
}

// ---------- TEXT / UI HELPERS ----------
const FONT = '"Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif';
function text(ctx, s, x, y, size, col, outline) {
  ctx.font = size + 'px ' + FONT; ctx.textAlign = ctx.textAlign || 'center'; ctx.lineJoin = 'round';
  ctx.lineWidth = outline == null ? Math.max(3, size / 5) : outline; ctx.strokeStyle = OUT; ctx.strokeText(s, x, y);
  ctx.fillStyle = col || '#fff'; ctx.fillText(s, x, y);
}
R.text = text; R.FONT = FONT; R.rr = rr; R.ell = ell; R.stroke = stroke; R.OUT = OUT; R.hsh = hsh;

function heart(ctx, x, y, s, full) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(0, 6); ctx.bezierCurveTo(-14, -4, -8, -16, 0, -8); ctx.bezierCurveTo(8, -16, 14, -4, 0, 6); ctx.closePath();
  ctx.fillStyle = full ? '#ff4d6d' : 'rgba(29,16,51,.45)'; ctx.fill(); ctx.lineWidth = 2.2; ctx.strokeStyle = OUT; ctx.stroke();
  if (full) { ell(ctx, -4, -6, 2.5, 1.6, -0.5); ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fill(); }
  ctx.restore();
}
R.heart = heart;
R.star = (ctx, x, y, s) => { ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? s * 0.45 : s; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } ctx.closePath(); ctx.fillStyle = '#ffd21a'; ctx.fill(); stroke(ctx, 2.5); };
R.lock = (ctx, x, y, s) => { ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.arc(0, -4, 8, Math.PI, 0); ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke();
  rr(ctx, -11, -4, 22, 16, 4); ctx.fillStyle = '#ffd21a'; ctx.fill(); stroke(ctx, 2.5); ell(ctx, 0, 3, 2.5, 3); ctx.fillStyle = OUT; ctx.fill(); ctx.restore(); };

R.drawHUD = (ctx, G, time, touch) => {
  const p = G.p, K = C.KINGDOMS[G.k], lv = G.lv;
  for (let i = 0; i < p.maxHp; i++) heart(ctx, 26 + i * 30, 28, 1.6, i < p.hp);
  ctx.textAlign = 'left'; drawSprite(ctx, 'gear', 28, 64, 0.9, false, time); text(ctx, String(G.gears), 46, 66, 24, '#ffd21a');
  ctx.textAlign = 'right'; text(ctx, String(G.score), W - (touch ? 70 : 20), 30, 28, '#fff');
  ctx.textAlign = 'center';
  const lbl = K.name.toUpperCase() + '  ' + G.n + '/12';
  text(ctx, lbl, W / 2, 22, 20, '#fff');
  if (!G.arena) { // progress bar
    const bw = 300, bx = W / 2 - bw / 2, by = 38, end = lv.isBoss ? lv.L + 160 : lv.gateX, f = Math.max(0, Math.min(1, p.x / end));
    rr(ctx, bx, by, bw, 12, 6); ctx.fillStyle = 'rgba(29,16,51,.5)'; ctx.fill(); stroke(ctx, 2);
    rr(ctx, bx + 2, by + 2, (bw - 4) * f, 8, 4); ctx.fillStyle = K.ink; ctx.fill();
    lv.cps.forEach(c => { const cx = bx + bw * c / end; ctx.fillStyle = '#fff'; rr(ctx, cx - 2, by - 3, 4, 18, 2); ctx.fill(); });
    ctx.save(); ctx.translate(bx + bw * f, by + 6); ctx.scale(0.32, 0.32); SPR[K.hero](ctx, time, {}); ctx.restore();
    if (lv.isBoss) text(ctx, '☠', bx + bw + 16, by + 7, 20, '#ff4d6d');
  }
  if (G.boss && G.boss.state !== 'dead') {
    const b = G.boss, bw = 420, bx = W / 2 - bw / 2, by = 46;

    rr(ctx, bx, by + 16, bw, 18, 9); ctx.fillStyle = 'rgba(29,16,51,.6)'; ctx.fill(); stroke(ctx, 3);

    ctx.save(); ctx.beginPath(); ctx.rect(x, y, 170, 56); ctx.clip(); R.drawSprite(ctx, KK.hero, x + 34, y + 30, 0.55, false, time); ctx.restore();
    ctx.textAlign = 'center'; if (open) R.text(ctx, KK.name.split(' ')[0].toUpperCase(), x + 110, y + 30, 22, '#fff'); else R.lock(ctx, x + 110, y + 28, 1);
    if (S.cleared[kk] >= 12) R.star(ctx, x + 160, y + 6, 13);
    if (open) ui.push({ x, y, w: 170, h: 56, act: () => { mapK = kk; } });
  });
  addBtn({ x: 14, y: 18, w: 120, h: 50, label: 'BACK', size: 20, col: '#8b7dff', act: () => { state = 'title'; } });
  // path
  ctx.beginPath(); for (let n = 1; n <= 12; n++) { const p = nodePos(n); n === 1 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); }
  ctx.setLineDash([4, 14]); ctx.lineCap = 'round'; ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.stroke(); ctx.setLineDash([]);
  const cl = S.cleared[k];
  for (let n = 1; n <= 12; n++) {
    const p = nodePos(n), boss = n === 6 || n === 12, done = n <= cl, avail = n === cl + 1, r = boss ? 44 : 32;
    const pulse = avail ? 1 + Math.sin(time * 5) * 0.08 : 1;
    ctx.save(); ctx.translate(p.x, p.y); ctx.scale(pulse, pulse);
    R.ell(ctx, 0, 6, r, r); ctx.fillStyle = R.OUT; ctx.fill();
    R.ell(ctx, 0, 0, r, r); ctx.fillStyle = done ? K.ink : avail ? '#fff' : '#8a84a8'; ctx.fill(); R.stroke(ctx, 4);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (boss) { R.drawSprite(ctx, n === 6 ? K.mini.spr : K.big.spr, 0, 2, n === 6 ? 0.36 : 0.3, true, time); }
    else if (done) R.star(ctx, 0, 0, 18); else if (avail) R.text(ctx, String(n), 0, 2, 28, K.ink); else R.lock(ctx, 0, 0, 1);
    ctx.restore();
    if (boss) R.text(ctx, (n === 6 ? K.mini.name : K.big.name).toUpperCase(), p.x, p.y + r + 18, 15, '#ffd21a', 4);
    if (done || avail) ui.push({ x: p.x - r, y: p.y - r, w: r * 2, h: r * 2, def: avail, act: () => startLevel(k, n) });
  }
  ctx.textAlign = 'center'; R.text(ctx, 'Tap a level to play!', W / 2, 520, 20, '#fff');
}
function drawWin() {
  R.drawGame(ctx, G, fx, time); ctx.fillStyle = 'rgba(29,16,51,.45)'; ctx.fillRect(0, 0, W, H);
  const r = result, K = C.KINGDOMS[r.k];
  panel(W / 2 - 300, 70, 600, 400);
  ctx.textAlign = 'center';
  R.text(ctx, r.boss ? 'BOSS DEFEATED!' : 'LEVEL SAVED!', W / 2, 118, 48, K.ink, 10);
  R.drawSprite(ctx, K.captive, W / 2, 212 - Math.abs(Math.sin(time * 6)) * 12, 1.1, false, time);
  const lines = [['Robots chomped', r.chomps], ['Gears', r.gears], ['Best combo', 'x' + Math.max(1, r.combo)], ['Score', r.score]];
  lines.forEach(([a, b], i) => { ctx.textAlign = 'left'; R.text(ctx, a, W / 2 - 200, 260 + i * 34, 24, '#fff'); ctx.textAlign = 'right'; R.text(ctx, String(b), W / 2 + 200, 260 + i * 34, 24, '#ffd21a'); });
  ctx.textAlign = 'center';
  if (r.saved) addBtn({ x: W / 2 - 150, y: 400, w: 300, h: 70, label: 'NEXT!', def: true, col: K.ink, act: () => { state = r.all ? 'victory' : 'kingdomSaved'; } });
  else {
    if (r.n < 12) addBtn({ x: W / 2 + 10, y: 400, w: 240, h: 70, label: 'NEXT!', def: true, col: K.ink, act: () => startLevel(r.k, r.n + 1) });
    addBtn({ x: r.n < 12 ? W / 2 - 250 : W / 2 - 120, y: 400, w: 240, h: 70, label: 'MAP', col: '#8b7dff', def: r.n >= 12, act: () => { mapK = r.k; state = 'map'; } });
  }
}
function drawKingdomSaved() {
  const r = result, K = C.KINGDOMS[r.k];
  R.drawBackdrop(ctx, r.k, time);
  for (let i = 0; i < 8; i++) R.inkSplat(ctx, 80 + i * 120, 100 + R.hsh(i) * 360, 40 + R.hsh(i + 3) * 40, i % 2 ? K.ink : K.ink2, i);
  ctx.textAlign = 'center'; R.text(ctx, 'THE ' + K.name.toUpperCase(), W / 2, 110, 54, '#fff', 10); R.text(ctx, 'IS SAVED!', W / 2, 176, 72, '#ffd21a', 12);
  R.drawSprite(ctx, K.hero, W / 2 - 120, 300 + Math.sin(time * 5) * 12, 2, false, time, { moving: true, bite: Math.max(0, Math.sin(time * 6)) });
  R.drawSprite(ctx, K.captive, W / 2 + 120, 320 - Math.abs(Math.sin(time * 6)) * 30, 2, true, time);
  const next = C.currentKingdom(S);
  if (next) { R.text(ctx, 'But the ' + C.KINGDOMS[next].name + ' still needs help...', W / 2, 410, 26, '#fff');
    addBtn({ x: W / 2 - 170, y: 440, w: 340, h: 70, label: 'GO AS ' + C.KINGDOMS[next].heroName.toUpperCase() + '!', def: true, col: C.KINGDOMS[next].ink, act: () => { flow = next; state = 'story'; } }); }
  else addBtn({ x: W / 2 - 150, y: 440, w: 300, h: 70, label: 'NEXT!', def: true, act: () => { state = 'victory'; } });
}
function drawVictory() {
  R.drawBackdrop(ctx, ['sea', 'land', 'air'][Math.floor(time / 3) % 3], time);
  for (let i = 0; i < 14; i++) R.inkSplat(ctx, ((i * 97 + time * 30) % (W + 100)) - 50, 60 + R.hsh(i) * 420, 30 + R.hsh(i + 2) * 30, ['#ff7a1a', '#8dff1f', '#ff2fa8'][i % 3], i);
  ctx.textAlign = 'center'; R.text(ctx, 'ALL THREE KINGDOMS', W / 2, 90, 50, '#fff', 10); R.text(ctx, 'ARE SAVED!', W / 2, 160, 76, '#ffd21a', 12);
  HEROES.forEach((h, i) => R.drawSprite(ctx, h, 230 + i * 250, 310 - Math.abs(Math.sin(time * 5 + i)) * 40, 1.8, false, time, { moving: true, bite: Math.max(0, Math.sin(time * 6 + i)) }));
  R.text(ctx, 'The robots are scrap! You answered the Call of the Wild!', W / 2, 420, 24, '#fff');
  addBtn({ x: W / 2 - 140, y: 450, w: 280, h: 66, label: 'YAY!', def: true, col: '#ff2fa8', act: () => { state = 'title'; } });
}
function drawPause() {
  R.drawGame(ctx, G, fx, time); R.drawHUD(ctx, G, time, touchMode); ctx.fillStyle = 'rgba(29,16,51,.55)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; R.text(ctx, 'PAUSED', W / 2, 120, 64, '#fff', 12);
  addBtn({ x: W / 2 - 150, y: 180, w: 300, h: 70, label: 'KEEP PLAYING', def: true, col: '#19c37d', act: () => { state = 'play'; } });
  addBtn({ x: W / 2 - 150, y: 270, w: 300, h: 60, label: 'MAP', size: 26, col: '#8b7dff', act: () => { mapK = G.k; state = 'map'; } });
  addBtn({ x: W / 2 - 150, y: 350, w: 300, h: 60, label: A.muted ? 'SOUND: OFF' : 'SOUND: ON', size: 24, col: '#ffd21a', act: () => setMuted(!A.muted) });
  if (!touchMode) R.text(ctx, 'Arrows / WASD move  •  SPACE chomp  •  UP jump/flap  •  DOWN dive', W / 2, 470, 18, '#fff', 4);
}

// ---------- loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; time += dt;
  if (state === 'play' && !devOpen) {
    acc += dt;
    while (acc >= C.DT) {
      acc -= C.DT;
      C.step(G, readInput(), C.DT);
      R.handleEvents(fx, G); R.stepFx(fx, G, C.DT);
      for (const e of G.events) { sfx(e.t); if (e.t === 'ko') banner = { txt: 'TRY AGAIN!', sub: 'Back to the checkpoint', t: 1.6 }; if (e.t === 'bossIntro') banner = { txt: e.name.toUpperCase(), sub: 'BOSS FIGHT!', t: 2.0 }; }
      if (G.done && G.doneT > 1.8 && state === 'play') { finishLevel(); break; }
    }
  } else acc = 0;
  ui = [];
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.textBaseline = 'middle';
  if (state === 'title') drawTitle();
  else if (state === 'confirm') drawConfirm();
  else if (state === 'pick') drawPick();
  else if (state === 'story') drawStory();
  else if (state === 'map') drawMap();
  else if (state === 'play') {
    R.drawGame(ctx, G, fx, time); R.drawHUD(ctx, G, time, touchMode);
    if (touchMode) R.drawTouch(ctx, G, TBTN, held);
    if (banner && banner.t > 0) { banner.t -= dt; const a = Math.min(1, banner.t * 2); ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; R.text(ctx, banner.txt, W / 2, 200, 60, '#ffd21a', 12); R.text(ctx, banner.sub, W / 2, 252, 28, '#fff'); ctx.restore(); }
  }
  else if (state === 'pause') drawPause();
  else if (state === 'win') drawWin();
  else if (state === 'kingdomSaved') drawKingdomSaved();
  else if (state === 'victory') drawVictory();
  requestAnimationFrame(frame);
}

// ---------- sizing ----------
let scale = 1;
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const vw = window.innerWidth, vh = window.innerHeight, s = Math.min(vw / W, vh / H);
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.floor(W * s * dpr); cv.height = Math.floor(H * s * dpr); scale = s * dpr;
}
window.addEventListener('resize', resize); resize();
window.__COTW_DEBUG = { get G() { return G; }, get state() { return state; }, set state(v) { state = v; }, startLevel, get S() { return S; } };
const go = () => requestAnimationFrame(t => { last = t; frame(t); });
if (document.fonts && document.fonts.load) document.fonts.load('40px "Lilita One"').then(go, go); else go();
})();
</script>
