<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artillery Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a storybook war-room for a 7-year-old commander; bold, warm, never babyish.
   IDEA: a royal campaign table: parchment-free, painted map board inside a castle-blue frame.
   PICTURE: the live battle map with hand-drawn sprites is the hero on every screen that matters.
   COLOUR and TYPE: castle blue frame, meadow board, sunflower-yellow accent (Clucky's banner); Lilita One + Nunito.
   LAYOUT: board on top, command panel beside it on wide screens, below it on narrow ones. */
:root{color-scheme:light dark;
  --bg:light-dark(#e9eef7,#0f1626);--frame:light-dark(#1f3a68,#16294a);--card:light-dark(#ffffff,#1b2740);
  --ink:light-dark(#1b2433,#e8edf6);--soft:light-dark(#5a6680,#a9b4c9);--line:light-dark(#d5dceb,#2c3b5c);
  --sun:#f4c430;--sunInk:#3a2a00;--good:#2f8f46;--bad:#c2410c;--fr:#2251a8;--frSoft:light-dark(#e3ebfb,#1d2c4f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Lilita One",Nunito,sans-serif;font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;min-height:44px;padding:8px 16px;font-weight:800}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{background:var(--sun);color:var(--sunInk);box-shadow:0 3px 0 #b98d10}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b98d10}
.btn2{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn[disabled],.btn2[disabled]{opacity:.45;cursor:not-allowed}
header{background:var(--frame);color:#fff;padding:10px max(3vw,12px);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
header h1{font-size:clamp(24px,3.4vw,34px);flex:1 1 auto;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{background:rgba(255,255,255,.14);border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px;white-space:nowrap}
.lang{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
.lang button{min-height:38px;border-radius:999px;padding:4px 14px;background:transparent;color:#fff}
.lang button[aria-pressed=true]{background:var(--sun);color:var(--sunInk)}
.bonus{background:var(--fr);color:#fff}
main{max-width:1240px;margin:0 auto;padding:16px max(3vw,12px) 40px}
.screen{display:none}.screen.on{display:block}
.card{background:var(--card);border-radius:18px;padding:clamp(16px,2.4vw,26px);box-shadow:0 2px 0 var(--line)}
.grid2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:980px){.grid2{grid-template-columns:minmax(0,1fr) 340px}}
.board{position:relative;border-radius:16px;overflow:hidden;border:6px solid var(--frame);background:#7fb94e;aspect-ratio:5/3}
.board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
.panel{display:flex;flex-direction:column;gap:12px}
.stat{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.coins{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:30px}
.c100,.c10,.c1{display:inline-block;border-radius:6px}
.c100{width:30px;height:22px;background:#8a5a2b;border:3px solid var(--sun)}
.c10{width:16px;height:16px;border-radius:50% 50% 40% 40%;background:#d9a441}
.c1{width:10px;height:10px;border-radius:50%;background:var(--sun);border:1px solid #b98d10}
.shop{display:grid;gap:8px}
.tw{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:2px solid var(--line);color:var(--ink);padding:8px 10px}
.tw[aria-pressed=true]{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 18%,var(--card))}
.tw .ic{width:38px;height:38px;flex:none}
.tw b{display:block}.tw small{color:var(--soft);font-weight:700;font-size:13px}
.tw .pr{margin-left:auto;font-family:"Lilita One";font-size:22px;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.say{display:flex;gap:8px;align-items:flex-start}
.say>div{flex:1}
.say .en{display:none;color:var(--soft);font-style:italic;margin-top:4px}
.say.show .en{display:block}
.mini{min-height:36px;padding:4px 10px;font-size:14px;border-radius:999px;background:var(--frSoft);color:var(--fr);flex:none}
.hero{display:grid;gap:18px;align-items:center;grid-template-columns:minmax(0,1fr)}
@media(min-width:820px){.hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.hero h2{font-size:clamp(32px,4.4vw,48px)}
.menuBtns{display:grid;gap:10px}
.menuBtns button{font-size:20px;min-height:56px}
.medals{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.medals div{background:var(--bg);border-radius:14px;padding:10px 12px}
.medals b{font-family:"Lilita One";font-size:28px;display:block;line-height:1}
.medals span{font-size:14px;color:var(--soft);font-weight:700}
.beast{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.beast{grid-template-columns:220px minmax(0,1fr)}}
.beast canvas{width:100%;max-width:220px;aspect-ratio:1;background:#7fb94e;border-radius:16px;border:5px solid var(--frame)}
.weak{display:inline-block;background:var(--sun);color:var(--sunInk);border-radius:999px;padding:4px 12px;font-weight:800}
#modal{position:fixed;inset:0;background:rgba(10,16,30,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal.on{display:flex}
#modal .card{max-width:560px;width:100%;max-height:92vh;overflow:auto}
#modal h3{font-size:28px;margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.opts button{font-size:20px}
input.num{width:9ch;font-size:28px;font-family:"Lilita One";text-align:center;border:3px solid var(--line);border-radius:12px;padding:4px;background:var(--bg)}
.msg{min-height:26px;font-weight:800;margin-top:8px}
.msg.good{color:var(--good)}.msg.bad{color:var(--bad)}
.eq{font-family:"Lilita One";font-size:30px;white-space:nowrap}
.logbox{display:grid;gap:14px}
.logbox label{font-weight:800;display:block;margin-bottom:4px}
.logbox textarea{width:100%;min-height:76px;border:3px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);font-size:18px;resize:vertical}
.check{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.check li::before{content:"○ ";color:var(--soft)}
.check li.ok::before{content:"✓ ";color:var(--good)}
.spot{background:color-mix(in srgb,var(--sun) 25%,var(--card));border-radius:10px;padding:6px 10px;font-weight:700}
.bosses{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.boss{border:3px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px;background:var(--card);text-align:left;color:var(--ink)}
.boss b{font-family:"Lilita One";font-size:30px;font-weight:400}
.boss.def{opacity:.6}
.arena{display:grid;gap:14px;justify-items:center;text-align:center}
.shield{font-family:"Lilita One";font-size:44px;background:var(--frame);color:#fff;border-radius:50% 50% 40% 40%/40% 40% 60% 60%;width:170px;height:190px;display:grid;place-items:center;transition:transform .2s}
.shield.hit{transform:rotate(-8deg) scale(.94)}
.hp{display:flex;gap:6px}.hp i{width:34px;height:12px;border-radius:6px;background:var(--bad)}.hp i.gone{background:var(--line)}
.sentence{font-size:24px;font-weight:800}
.tricky{font-family:"Lilita One";font-size:44px;letter-spacing:2px}
.tricky em{font-style:normal;color:var(--bad);text-decoration:underline}
textarea.out{width:100%;min-height:200px;font:14px/1.4 ui-monospace,monospace;border:2px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}
.note{font-size:14px;color:var(--soft)}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.scroll{overflow-x:auto}
@media(prefers-reduced-motion:reduce){.shield{transition:none}}
</style>
</head>
<body>
<header>
  <a id="arcade" href="../index.html" hidden style="color:#fff;font-weight:800;text-decoration:none;white-space:nowrap">← Pew Pew Palace</a>
  <h1 id="gameName">Artillery Academy</h1>
  <div class="chips">
    <span class="chip" id="rankChip">Recruit</span>
    <span class="chip" id="treasChip">Treasury 0</span>
    <span class="chip bonus" id="bonusChip" hidden>Bonus de bravoure +25%</span>
    <div class="lang" role="group" aria-label="Language">
      <button id="lEn" aria-pressed="true">English</button>
      <button id="lFr" aria-pressed="false">Français</button>
    </div>
  </div>
</header>
<main>
  <section class="screen on" id="sMenu"></section>
  <section class="screen" id="sScout"></section>
  <section class="screen" id="sBattle">
    <div class="grid2">
      <div class="board"><canvas id="cv" width="800" height="480" aria-label="Battle map"></canvas></div>
      <div class="panel card" id="panel"></div>
    </div>
  </section>
  <section class="screen" id="sLog"></section>
  <section class="screen" id="sBoss"></section>
  <section class="screen" id="sDad"></section>
</main>
<div id="modal"><div class="card" id="mcard" role="dialog" aria-modal="true"></div></div>

/* ---------- buying: estimate, then exact ---------- */
function openModal(html){ $('mcard').innerHTML = html; $('modal').classList.add('on'); if(bt) bt.paused = true; }
function closeModal(){ $('modal').classList.remove('on'); if(bt) bt.paused = false; }
function tryBuy(type){
  if(bt.phase === 'wave') return;
  const p = bt.prices[type];
  if(bt.gold < p){ $('pmsg').textContent = T('broke'); return; }
  const g = bt.gold, r = g - p, near = Math.round(r/10)*10;
  const offs = pick([[-40,40],[-50,30],[30,60],[-60,-30],[40,-30]]);
  let opts = [near, near+offs[0], near+offs[1]].filter((x,i,a) => x >= 0 && a.indexOf(x) === i);
  while(opts.length < 3){ const x = near + 10*rnd(3,8)*(Math.random()<.5?-1:1); if(x>=0 && !opts.includes(x)) opts.push(x); }
  opts.sort((a,b) => a-b);
  const rec = {g, p, est: 0, tries: 0, flagged: 0, ok: 0};
  const tw = TOWERS[type];
  const q = fill(S.est1[L()], {g, p, T: tw.art[L()]});
  const qEn = fill(S.est1[0], {g, p, T: tw.art[0]});
  openModal(`<h3>\u{1F52D} ${esc(L()?'L’éclaireur':'The Scout')}</h3>${say(q, qEn)}
    <div class="opts">${opts.map(x => `<button class="btn2" data-est="${x}">${esc(T('about',{x}))}</button>`).join('')}</div>`);
  $('mcard').querySelectorAll('[data-est]').forEach(b => b.onclick = () => {
    const chosen = +b.dataset.est; rec.est = Math.abs(chosen - r) <= 6 ? 1 : 0; rec.chosen = chosen;
    exactStep(type, rec);
  });
}
function exactStep(type, rec){
  const {g, p} = rec; const r = g - p;
  const lead = rec.est ? S.estGood : S.estOff;
  openModal(`<h3>\u{1F4B0} ${esc(T('treasury'))}</h3>${say(lead[1], lead[0])}
    <p class="eq">${g} − ${p} = <input class="num" id="ans" inputmode="numeric" autocomplete="off" aria-label="answer"></p>
    <div class="row"><button class="btn" id="chk">${esc(T('check'))}</button><button class="btn2" id="cx">${esc(T('cancel'))}</button></div>
    <div class="msg" id="amsg"></div><div id="ahint"></div>`);
  const inp = $('ans'); setTimeout(() => inp.focus(), 30);
  const go = () => {
    const v = parseInt(inp.value, 10); if(isNaN(v)) return;
    rec.tries++;
    if(v === r){
      rec.ok = 1; bt.buys.push([rec.g, rec.p, rec.est, rec.tries, rec.flagged]);
      bt.placing = type; bt.pendingPay = r;
      $('mcard').innerHTML = `<h3>✅</h3>${say(fill(S.rightBuy[1],{r}), fill(S.rightBuy[0],{r}))}<div class="row" style="margin-top:12px"><button class="btn" id="okb">${esc(T('okBtn'))}</button></div>`;
      $('okb').onclick = () => { closeModal(); renderPanel(); }; $('okb').focus();
      return;
    }
    const m = $('amsg');
    if(Math.abs(v - (rec.chosen ?? r)) > 20 && rec.est){ rec.flagged = 1; m.className = 'msg bad'; m.textContent = T('mismatch',{e:rec.chosen}); }
    else { m.className = 'msg bad'; m.textContent = T('tryAgain'); }
    if(rec.tries === 2){
      const u = p % 10; let h;
      if(u >= 7){ const P = p + (10-u), d = 10-u; h = [fill(S.hintRound[1],{p,P,d,g,gP:g-P}), fill(S.hintRound[0],{p,P,d,g,gP:g-P})]; }
      else { const t = p - u; h = [fill(S.hintSplit[1],{g,t,gt:g-t,o:u}), fill(S.hintSplit[0],{g,t,gt:g-t,o:u})]; }
      $('ahint').innerHTML = say(h[0], h[1]);
    }
    if(rec.tries >= 4){
      bt.buys.push([rec.g, rec.p, rec.est, rec.tries, rec.flagged]);
      bt.placing = type; bt.pendingPay = r;
      $('mcard').innerHTML = `<h3>\u{1F6E1}️</h3>${say(fill(S.reveal[1],{r,g,p}), fill(S.reveal[0],{r,g,p}))}<div class="row" style="margin-top:12px"><button class="btn" id="okb">${esc(T('okBtn'))}</button></div>`;
      $('okb').onclick = () => { closeModal(); renderPanel(); };
      return;
    }
    inp.select();
  };
  $('chk').onclick = go; inp.onkeydown = e => { if(e.key === 'Enter') go(); };
  $('cx').onclick = () => { closeModal(); };
}

/* ---------- canvas input ---------- */
const cv = $('cv'), g = cv.getContext('2d');
function tileFromEvent(e){
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * CW, y = (e.clientY - r.top) / r.height * CH;
  return [Math.floor(x/TS), Math.floor(y/TS)];
}
function canBuild(tx, ty){
  if(tx<0||ty<0||tx>19||ty>11) return false;
  if(pathSet.has(tx+','+ty) || castleTile(tx,ty)) return false;
  return !bt.towers.some(t => t.tx===tx && t.ty===ty);
}

/* ---------- waves ---------- */
function startWave(){
  if(bt.phase !== 'build' || bt.placing) return;
  const known = save.known.slice();
  const count = Math.min(6 + 2*bt.wave + Math.min(bt.n, 6), 20);
  const scale = 1 + .1*(Math.min(bt.n, 12) - 1) + .12*(bt.wave - 1);
  bt.queue = [];
  for(let i=0;i<count;i++){
    const type = (i % 3 === 0 || known.length === 1) ? bt.foe : pick(known);
    bt.queue.push({type, scale});
  }
  bt.spawnT = .5; bt.phase = 'wave'; renderPanel();
}
function spawn(q){
  const f = FOES[q.type];
  bt.foes.push({type:q.type, hp:Math.round(f.hp*q.scale), max:Math.round(f.hp*q.scale), d:0, slow:0, x:WP[0][0], y:WP[0][1]});
}
function mult(tw, foe){
  if(foe === 'troll') return tw==='archer'?.35 : tw==='frost'?.5 : tw==='eclair'?.7 : 1.4;
  if(foe === 'imp') return tw==='cannon'?.5 : tw==='frost'?2.2 : 1;
  return 1;
}
function hurt(f, dmg, tw){
  if(f.hp <= 0) return;
  f.hp -= dmg * mult(tw, f.type);
  if(f.hp <= 0){
    const gold = FOES[f.type].gold; bt.gold += gold; bt.kills[tw]++; bt.killed++;
    bt.fx.push({k:'txt', x:f.x, y:f.y-18, s:'+'+gold, c:'#ffe14d', life:.9});
    bt.fx.push({k:'puff', x:f.x, y:f.y, life:.4});
  }
}
function step(dt){
  bt.t += dt;
  for(const fx of bt.fx) fx.life -= dt;
  bt.fx = bt.fx.filter(f => f.life > 0);
  if(bt.phase !== 'wave') return;
  if(bt.queue.length){ bt.spawnT -= dt; if(bt.spawnT <= 0){ const q = bt.queue.shift(); spawn(q); bt.spawnT = q.type==='troll' ? 1.5 : .85; } }
  for(const f of bt.foes){
    if(f.hp <= 0) continue;
    const sp = FOES[f.type].sp * (f.slow > 0 ? .5 : 1); f.slow -= dt;
    f.d += sp*dt; const [x,y] = posAt(f.d); f.x = x; f.y = y;
    if(f.d >= totalLen){ f.hp = 0; f.leak = true; bt.lives--; bt.leaked++; bt.fx.push({k:'txt', x:735, y:330, s:'−1 ❤️', c:'#ffb4a8', life:1}); renderPanel(); }
  }
  for(const tw of bt.towers){
    const st = TOWERS[tw.type]; tw.cd -= dt; if(tw.cd > 0) continue;
    let best = null;
    for(const f of bt.foes){
      if(f.hp <= 0) continue;
      if(FOES[f.type].fly && !st.air) continue;
      if(Math.hypot(f.x-tw.x, f.y-tw.y) <= st.range && (!best || f.d > best.d)) best = f;
    }
    if(!best) continue;
    tw.cd = st.rate; tw.ang = Math.atan2(best.y-tw.y, best.x-tw.x);
    if(st.chain){
      let pts = [[tw.x, tw.y-24]], cur = best, hit = [];
      for(let i=0;i<st.chain && cur;i++){ hit.push(cur); pts.push([cur.x, cur.y]); hurt(cur, st.dmg, tw.type);
        cur = bt.foes.filter(o => o.hp>0 && !hit.includes(o) && Math.hypot(o.x-cur.x,o.y-cur.y) < 80).sort((a,b)=>b.d-a.d)[0]; }
      bt.fx.push({k:'bolt', pts, life:.18});
    } else bt.shots.push({type:tw.type, x:tw.x, y:tw.y-18, tgt:best, sp: tw.type==='cannon'?320:460});
  }
  for(const s of bt.shots){
    const t = s.tgt; const dx = t.x - s.x, dy = (t.y - (FOES[t.type].fly?16:0)) - s.y; const d = Math.hypot(dx, dy);
    if(d < 8 || t.hp <= 0){
      s.done = true; if(t.hp <= 0 && !t.leak && d >= 8) continue;
      const st = TOWERS[s.type];
      if(st.splash){ for(const f of bt.foes) if(f.hp>0 && !FOES[f.type].fly && Math.hypot(f.x-t.x,f.y-t.y) <= st.splash) hurt(f, st.dmg, s.type); bt.fx.push({k:'boom', x:t.x, y:t.y, life:.3}); }
      else { hurt(t, st.dmg, s.type); if(st.slow) t.slow = 1.6; }
      continue;
    }
    s.x += dx/d * s.sp*dt; s.y += dy/d * s.sp*dt;
  }
  bt.shots = bt.shots.filter(s => !s.done);
  bt.foes = bt.foes.filter(f => f.hp > 0);
  if(!bt.supOn && bt.supCount < 2){ bt.supT -= dt; if(bt.supT <= 0){ bt.supOn = {life: 9}; bt.supT = 22; } }
  if(bt.supOn){ bt.supOn.life -= dt; if(bt.supOn.life <= 0) bt.supOn = null; }
  if(bt.lives <= 0){ endBattle(false); return; }
  if(!bt.queue.length && !bt.foes.length){
    if(bt.wave >= 3){ endBattle(true); return; }
    bt.wave++; bt.phase = 'build'; bt.shots = []; renderPanel();
  }
}

/* ---------- drawing the battle ---------- */
function draw(){
  drawGround(g);
  if(bt.placing && bt.hover){
    const [tx,ty] = bt.hover; const ok = canBuild(tx,ty);
    g.fillStyle = ok ? 'rgba(255,255,255,.35)' : 'rgba(194,65,12,.35)'; g.fillRect(tx*TS, ty*TS, TS, TS);
    if(ok){ g.strokeStyle = 'rgba(255,255,255,.7)'; g.setLineDash([6,6]); g.beginPath(); g.arc(tx*TS+TS/2, ty*TS+TS/2, TOWERS[bt.placing].range, 0, 7); g.stroke(); g.setLineDash([]); }
  }
  const items = [...bt.towers.map(t => ({y:t.y, f:() => drawTower(g, t.type, t.x, t.y, t.ang, bt.t)})),
                 ...bt.foes.map(f => ({y:f.y, f:() => { drawFoe(g, f.type, f.x, f.y, bt.t + f.d*.01, 1, f.slow>0);
                   const fy = FOES[f.type].fly ? f.y-40 : f.y-(f.type==='troll'?28:22);
                   g.fillStyle = 'rgba(0,0,0,.4)'; g.fillRect(f.x-14, fy, 28, 4); g.fillStyle = '#4ade80'; g.fillRect(f.x-14, fy, 28*Math.max(0,f.hp)/f.max, 4); }}))];
  items.sort((a,b) => a.y-b.y).forEach(i => i.f());
  for(const s of bt.shots){
    if(s.type === 'cannon'){ g.fillStyle = '#1f232b'; g.beginPath(); g.arc(s.x, s.y, 5, 0, 7); g.fill(); }
    else if(s.type === 'frost'){ g.fillStyle = '#bfe9ff'; g.beginPath(); g.arc(s.x, s.y, 4, 0, 7); g.fill(); }
    else { const a = Math.atan2(s.tgt.y-s.y, s.tgt.x-s.x); g.strokeStyle = '#5b3b1f'; g.lineWidth = 2; g.beginPath(); g.moveTo(s.x, s.y); g.lineTo(s.x-Math.cos(a)*10, s.y-Math.sin(a)*10); g.stroke(); }
  }
  for(const fx of bt.fx){
    g.globalAlpha = Math.max(0, Math.min(1, fx.life*2));
    if(fx.k === 'txt'){ g.font = '700 18px Nunito, sans-serif'; g.textAlign = 'center'; g.lineWidth = 4; g.strokeStyle = 'rgba(0,0,0,.55)'; g.strokeText(fx.s, fx.x, fx.y - (1-fx.life)*20); g.fillStyle = fx.c; g.fillText(fx.s, fx.x, fx.y - (1-fx.life)*20); }
    else if(fx.k === 'boom'){ g.fillStyle = 'rgba(255,170,60,.6)'; g.beginPath(); g.arc(fx.x, fx.y, 46*(1-fx.life/.3)+8, 0, 7); g.fill(); }
    else if(fx.k === 'puff'){ g.fillStyle = 'rgba(255,255,255,.7)'; g.beginPath(); g.arc(fx.x, fx.y, 18*(1-fx.life/.4)+4, 0, 7); g.fill(); }
    else if(fx.k === 'bolt'){ g.strokeStyle = '#ffe14d'; g.lineWidth = 3; g.beginPath(); fx.pts.forEach((p,i) => i ? g.lineTo(p[0]+rnd(-4,4), p[1]+rnd(-4,4)) : g.moveTo(p[0],p[1])); g.stroke(); }
    g.globalAlpha = 1;
  }
  if(bt.supOn){
    const y = 36 + Math.sin(bt.t*4)*3;
    g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.roundRect ? g.roundRect(330, y-26, 140, 52, 14) : g.rect(330, y-26, 140, 52); g.fill();
    g.fillStyle = '#8a5a2b'; g.fillRect(350, y-14, 40, 20); g.fillStyle = '#f4c430'; g.fillRect(354, y-18, 32, 6);
    g.fillStyle = '#2b2b2b'; g.beginPath(); g.arc(358, y+8, 6, 0, 7); g.arc(382, y+8, 6, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.font = '800 16px Nunito, sans-serif'; g.textAlign = 'left'; g.fillText(L()?'Clique !':'Click!', 400, y+6);
  }
  if(bt.phase === 'build' && !bt.placing){
    g.fillStyle = 'rgba(31,58,104,.85)'; g.fillRect(0, CH-34, CW, 34);
    g.fillStyle = '#fff'; g.font = '800 16px Nunito, sans-serif'; g.textAlign = 'center';
    g.fillText((L()?'Vague ':'Wave ')+bt.wave+(L()?' sur 3 — achète des tours, puis lance la vague.':' of 3 — buy towers, then start the wave.'), CW/2, CH-12);
  }
}
let last = 0, looping = false;
function frame(ts){
  if(!bt || screen !== 'sBattle'){ looping = false; return; }
  const dt = Math.min(.05, (ts - last)/1000 || 0); last = ts;
  if(!bt.paused){ const n = bt.fast ? 2 : 1; for(let i=0;i<n && bt && screen==='sBattle';i++) step(dt); }
  if(bt && screen === 'sBattle') draw();
  requestAnimationFrame(frame);
}
function startLoop(){ if(looping) return; looping = true; last = performance.now(); requestAnimationFrame(frame); }

/* ---------- end of battle ---------- */
function endBattle(won){

  const msg = won ? S.win : S.lose;
  openModal(`<h3>${won ? '\u{1F3C6}' : '\u{1F3F0}'}</h3>${say(msg[1], msg[0])}<div class="row" style="margin-top:14px"><button class="btn" id="toLog">${esc(T('toLog'))}</button></div>`);
  $('toLog').onclick = () => { closeModal(); show('sLog'); renderLog(); };
}

/* ---------- Commander's Log ---------- */
let dictTarget = null;
function wordsIn(s){ return (s.trim().match(/[\p{L}\p{N}'’-]+/gu) || []); }
function hasNum(s){ return /\d/.test(s) || /\b(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|twenty|thirty|forty|fifty|un|une|deux|trois|quatre|cinq|six|sept|huit|neuf|dix|onze|douze|vingt|trente|quarante|cinquante)\b/i.test(s); }
function hasBecause(s){ return /\bbecause\b|\bparce qu|\bcar\b|\bsince\b/i.test(s); }
function spotBoss(text){
  const lg = bt ? bt.lang : save.lang; const out = []; const lower = ' '+text.toLowerCase().replace(/[^\p{L}\s']/gu,' ')+' ';
  for(const b of BOSSES[lg]) for(const v of b.v) if(lower.includes(' '+v+' ') && !out.some(o=>o.bad===v)) out.push({bad:v, good:b.w});
  for(const [bad, good] of Object.entries(EXTRA_SPOT[lg])) if(lower.includes(' '+bad+' ') && !out.some(o=>o.bad===bad)) out.push({bad, good});
  return out;
}
function renderLog(){
  if(!bt){ show('sMenu'); renderMenu(); return; }
  const killRows = shopTypes().map(k => `<li>${esc(TOWERS[k].n[L()])}: <b>${bt.kills[k]||0}</b></li>`).join('');
  const box = (i, lab, ph) => `<div><label for="lb${i}">${esc(T(lab))}</label>
     <div class="row" style="flex-wrap:nowrap;align-items:stretch"><textarea id="lb${i}" placeholder="${esc(T(ph))}">${esc((bt.draft||[])[i-1]||'')}</textarea>
     <button class="btn2 mic" data-mic="${i}" hidden style="flex:none">\u{1F3A4}</button></div></div>`;
  $('sLog').innerHTML = `<div class="card" style="display:grid;gap:16px">
    <h2 style="font-size:clamp(30px,4vw,44px)">\u{1F4DC} ${esc(T('logTitle'))}</h2>
    ${say(S.logIntro[1], S.logIntro[0])}
    <div class="grid2">
      <div class="logbox">${box(1,'b1','ph1')}${box(2,'b2','ph2')}${box(3,'b3','ph3')}<div id="spots" style="display:grid;gap:6px"></div></div>
      <div style="display:grid;gap:12px;align-content:start">
        <div class="medals"><div><b>${bt.killed}</b><span>${esc(T('defeated'))}</span></div><div><b>${Math.max(0,bt.lives)}</b><span>${esc(T('livesLeft'))}</span></div><div><b>${bt.gold}</b><span>${esc(T('goldLeft'))}</span></div></div>
        <ul style="margin:0">${killRows}</ul>
        <div><b>${esc(T('forMedal'))}</b><ul class="check" id="chkl"><li id="k1">${esc(T('c1'))}</li><li id="k2">${esc(T('c2'))}</li><li id="k3">${esc(T('c3'))}</li></ul></div>
      </div>
    </div>
    <div class="row"><button class="btn" id="sendLog" style="font-size:20px">${esc(T('send'))}</button><button class="btn2" id="skipLog">${esc(T('skipLog'))}</button></div>
  </div>`;
  const upd = () => {
    const v = [1,2,3].map(i => $('lb'+i).value); bt.draft = v;
    $('k1').classList.toggle('ok', hasBecause(v[0]) && wordsIn(v[0]).length >= 4);
    $('k2').classList.toggle('ok', hasNum(v[1]));
    $('k3').classList.toggle('ok', wordsIn(v[2]).length >= 3);
    $('spots').innerHTML = spotBoss(v.join(' ')).map(s => `<div class="spot">${esc(T('spotted', s))}</div>`).join('');
  };
  [1,2,3].forEach(i => $('lb'+i).addEventListener('input', upd)); upd();
  $('sendLog').onclick = () => finishBattle(false);
  $('skipLog').onclick = () => finishBattle(true);
  refreshMics();
}
function refreshMics(){
  document.querySelectorAll('[data-mic]').forEach(b => {
    b.hidden = !dict;
    b.onclick = () => {
      if(!dict) return;
      if(dictTarget){ dict.stop().catch(()=>{}); return; }
      dictTarget = $('lb'+b.dataset.mic);
      dict.start().catch(() => { dictTarget = null; });
    };
  });
}
function setupDict(){
  dict.onFinal(({text}) => { if(dictTarget){ dictTarget.value = (dictTarget.value ? dictTarget.value.trimEnd()+' ' : '') + text; dictTarget.dispatchEvent(new Event('input')); } });
  dict.onState(({state}) => {
    document.querySelectorAll('[data-mic]').forEach(b => b.textContent = state === 'listening' && dictTarget && b.dataset.mic === dictTarget.id.slice(2) ? '⏹' : '\u{1F3A4}');
    if(state === 'idle') dictTarget = null;
  });
}
function finishBattle(skipped){
  const v = skipped ? ['','',''] : [1,2,3].map(i => $('lb'+i).value);
  const words = wordsIn(v.join(' ')).length;
  const b = hasBecause(v[0]) && wordsIn(v[0]).length >= 4 ? 1 : 0, num = hasNum(v[1]) ? 1 : 0, nx = wordsIn(v[2]).length >= 3 ? 1 : 0;
  const medal = !skipped && b && num && nx ? 1 : 0;
  const fr = bt.lang === 'fr';
  const seul = fr && !bt.aided ? 1 : 0;
  const before = rankOf(save.frBattles);
  let reward = (bt.won ? 50 : 20) + (medal ? 20 : 0);
  if(fr) reward = Math.round(reward * 1.25);
  save.battles++; if(fr) save.frBattles++;
  save.medals += medal ? (fr ? 2 : 1) : 0; save.stars += seul; save.treasury += reward;
  const spots = skipped ? [] : spotBoss(v.join(' ')).map(s => s.bad);
  save.log.push({d:new Date().toISOString().slice(0,10), n:bt.n, lang:bt.lang, won:bt.won?1:0, lives:Math.max(0,bt.lives), aided:fr?(bt.aided?1:0):null,
    foe:bt.foe, buys:bt.buys, sups:bt.sups, kills:bt.kills, report:{skipped:skipped?1:0, words, because:b, number:num, next:nx, medal, spots, text: skipped ? '' : v.join(' | ').slice(0,600)}});
  const after = rankOf(save.frBattles);
  const lines = [];
  if(medal) lines.push(fr ? S.dmedal : S.medal); else if(!skipped) lines.push(S.noMedal);
  lines.push([fill(S.reward[0],{n:reward}), fill(S.reward[1],{n:reward})]);
  if(seul) lines.push(S.seul);
  if(after !== before) lines.push([fill(S.newRank[0],{r:after[1]}), fill(S.newRank[1],{r:after[2]})]);
  if(fr && save.frBattles === 10) lines.push(S.eclairOpen);
  persist();
  bt = null;
  openModal(`<h3>${medal ? '\u{1F3C5}' : '\u{1F4DC}'}</h3><div style="display:grid;gap:8px">${lines.map(l => say(l[1], l[0])).join('')}</div>
    <div class="row" style="margin-top:14px"><button class="btn" id="okb">${esc(T('backMenu'))}</button></div>`);
  $('okb').onclick = () => { closeModal(); show('sMenu'); renderAll(); };
}

/* ---------- Boss Words ---------- */
const DAY = 864e5;
function bossState(w){
  const b = save.bosses[save.lang+':'+w];
  if(!b || !b.def) return ['ready', 0];
  const left = Math.ceil((b.def + 7*DAY - Date.now())/DAY);
  return left > 0 ? ['beaten', left] : ['rematch', 0];
}
function renderBossList(){
  const list = BOSSES[save.lang];
  $('sBoss').innerHTML = `<div class="card" style="display:grid;gap:16px">
    <h2 style="font-size:clamp(30px,4vw,44px)">\u{1F6E1}️ ${esc(T('bossTitle'))}</h2>
    ${say(S.bossIntro[1], S.bossIntro[0])}
    <div class="bosses">${list.map(b => { const [st, d] = bossState(b.w);
      const lab = st==='ready' ? T('ready') : st==='rematch' ? T('rematch') : T('beaten')+' · '+T('returns',{d});
      return `<button class="boss ${st==='beaten'?'def':''}" data-boss="${esc(b.w)}" ${st==='beaten'?'disabled':''}><b>${'?'.repeat(b.w.replace(' ','').length)}</b><span>${esc(lab)}</span></button>`; }).join('')}</div>
    <div class="row"><button class="btn2" id="bBack">${esc(T('back'))}</button></div></div>`;
  $('sBoss').querySelectorAll('[data-boss]').forEach(b => b.onclick = () => bossFight(b.dataset.boss));
  $('bBack').onclick = () => { show('sMenu'); renderMenu(); };
}
function blankOut(sent, w){ const i = sent.toLowerCase().indexOf(w); return i < 0 ? sent : sent.slice(0,i) + '_____' + sent.slice(i+w.length); }
function bossFight(w){
  const lg = save.lang, B = BOSSES[lg].find(b => b.w === w); let hits = 0, tries = 0, round = 0;
  const draw = (msg, cls, tricky) => {
    const sent = B.s[round];
    const en = B.en ? B.en[round] : '';
    $('sBoss').innerHTML = `<div class="card arena">
      <div class="shield ${cls==='good'?'hit':''}">\u{1F479}</div>
      <div class="hp">${[0,1,2].map(i => `<i class="${i<hits?'gone':''}"></i>`).join('')}</div>
      <div class="say sentence"><div><div>${esc(blankOut(sent, w))}</div>${lg==='fr'?`<div class="en">${esc(en)}</div>`:''}</div>${lg==='fr'?'<button class="mini" data-hint>English?</button>':''}</div>
      <button class="btn2" id="again">\u{1F50A} ${esc(T('hearAgain'))}</button>
      ${tricky ? `<div class="tricky">${tricky}</div>` : ''}
      <div class="row" style="justify-content:center"><input class="num" id="bw" style="width:12ch" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="word"><button class="btn" id="bgo">${esc(T('check'))}</button></div>
      <div class="msg ${cls||''}">${esc(msg||'')}</div>
      <button class="btn2" id="bQuit">${esc(T('back'))}</button></div>`;
    $('again').onclick = () => speak(sent, lg);
    $('bQuit').onclick = () => { show('sBoss'); renderBossList(); };
    const inp = $('bw'); inp.focus();
    const go = () => {
      const val = inp.value.trim().toLowerCase().replace(/\s+/g,' ').replace(/[’]/g,"'");
      if(!val) return; tries++;
      if(val === w){
        hits++; round++;
        if(hits >= 3){
          save.bosses[lg+':'+w] = {def: Date.now(), wins: ((save.bosses[lg+':'+w]||{}).wins||0)+1};
          save.warChest += 20; save.bossLog.push({d:new Date().toISOString().slice(0,10), lang:lg, w, tries}); persist();
          $('sBoss').innerHTML = `<div class="card arena"><div class="shield hit">\u{1F4A5}</div><h2 style="font-size:40px">${esc(w)}</h2>${say(S.bossWin[1], S.bossWin[0])}<button class="btn" id="bDone">${esc(T('back'))}</button></div>`;
          $('bDone').onclick = () => { show('sBoss'); renderBossList(); };
          return;
        }
        draw(T('hit'), 'good'); speak(B.s[round], lg);
      } else {
        const [a, z] = B.tr; const tw = esc(w.slice(0,a)) + '<em>' + esc(w.slice(a,z)) + '</em>' + esc(w.slice(z));
        draw(T('lookTricky'), 'bad', tw);
        setTimeout(() => { const t = document.querySelector('.tricky'); if(t) t.style.visibility = 'hidden'; }, 2600);
      }
    };
    $('bgo').onclick = go; inp.onkeydown = e => { if(e.key === 'Enter') go(); };
  };
  show('sBoss'); draw(''); speak(B.s[0], lg);
}

/* ---------- Dad's corner (English only; it's for Dad) ---------- */
function summary(){
  const lg = save.log; const n = lg.length;
  const fr = lg.filter(x => x.lang==='fr'); const seul = fr.filter(x => x.aided===0).length;
  const reps = lg.filter(x => !x.report.skipped); const avgW = reps.length ? Math.round(reps.reduce((a,x)=>a+x.report.words,0)/reps.length) : 0;
  const buys = lg.flatMap(x => x.buys); const est = buys.filter(b => b[2]).length; const first = buys.filter(b => b[3]===1).length; const flag = buys.filter(b => b[4]).length;
  const sups = lg.flatMap(x => x.sups); const supOk = sups.filter(s => s[2]).length;
  const byKind = k => { const s = sups.filter(x => x[0]===k); return s.length ? `${s.filter(x=>x[2]).length}/${s.length}` : '–'; };
  const spots = {}; reps.forEach(x => x.report.spots.forEach(s => spots[s] = (spots[s]||0)+1));
  const pct = (a,b) => b ? Math.round(100*a/b)+'%' : '–';
  const lines = [
    `${save.name || 'Artillery Academy'}: play summary (as of ${new Date().toISOString().slice(0,10)})`,
    `Battles: ${n} (won ${lg.filter(x=>x.won).length}); in French: ${fr.length} (${pct(fr.length,n)}), seul: ${seul} of ${fr.length}`,
    `Commander's Logs written: ${reps.length} of ${n}; medals: ${reps.filter(x=>x.report.medal).length}; average words: ${avgW}`,
    `  with "because": ${reps.filter(x=>x.report.because).length}, with a number: ${reps.filter(x=>x.report.number).length}, with a plan: ${reps.filter(x=>x.report.next).length}`,
    `Shop math: ${buys.length} purchases; estimate right ${pct(est,buys.length)}; exact on first try ${pct(first,buys.length)}; slips the Scout caught: ${flag}`,
    `Supply riddles: ${supOk}/${sups.length} solved (more-than ${byKind('more')}, fewer-than trap ${byKind('fewer')}, take-away ${byKind('left')}, compare ${byKind('compare')})`,
    `Boss words defeated: ${save.bossLog.map(b => b.w + (b.lang==='fr'?' (FR)':'')).join(', ') || 'none yet'}`,
    `Boss-word misspellings spotted in his reports: ${Object.entries(spots).map(([k,v])=>k+' x'+v).join(', ') || 'none'}`,
    '', 'Recent battles (newest first):',
    ...lg.slice(-12).reverse().map(x => `${x.d} | ${x.lang.toUpperCase()}${x.lang==='fr'?(x.aided?' aidé':' seul'):''} | ${x.won?'won':'lost'} | buys ${x.buys.map(b=>`${b[0]}-${b[1]}${b[3]>1?' ('+b[3]+' tries)':''}`).join(', ')||'none'} | log ${x.report.skipped?'skipped':x.report.words+' words'+(x.report.medal?', medal':'')}`)
  ];
  return lines.join('\n');
}
let resetArmed = false;
function renderDad(){
  $('sDad').innerHTML = `<div class="card" style="display:grid;gap:16px">
    <h2 style="font-size:clamp(30px,4vw,44px)">Grown-ups’ corner</h2>
    <div><label for="gname" style="font-weight:800">Name of the game (let your player choose)</label>
      <div class="row"><input id="gname" value="${esc(save.name)}" placeholder="Artillery Academy" style="flex:1;min-height:44px;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg)"><button class="btn2" id="saveName">Save name</button></div></div>
    <div><b>Play summary</b> <span class="note">Copy it into your notes to see progress over time.</span>
      <textarea class="out" id="sumOut" readonly>${esc(summary())}</textarea>
      <div class="row"><button class="btn" id="copySum">Copy summary</button><button class="btn2" id="copyJson">Copy full data (JSON)</button><span class="msg good" id="cmsg"></span></div></div>
    <p class="note" style="margin:0">Progress saves to this browser${dbRef ? ' and to the page’s storage, so it follows your claude.ai account' : ' on this device'}. The French text was drafted with AI help: a fluent speaker should check it.</p>
    <div class="row"><button class="btn2" id="reset" style="border-color:var(--bad);color:var(--bad)">Reset all progress</button><span class="msg bad" id="rmsg"></span></div>
    <div class="row"><button class="btn2" id="dBack">Back</button></div></div>`;
  $('saveName').onclick = () => { save.name = $('gname').value.trim().slice(0,40); persist(); renderHeader(); $('cmsg').textContent = 'Saved.'; };
  const copy = txt => { (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => $('cmsg').textContent = 'Copied.').catch(() => { $('sumOut').value = txt; $('sumOut').select(); $('cmsg').textContent = 'Selected: press Ctrl+C or Cmd+C.'; }); };
  $('copySum').onclick = () => copy(summary());
  $('copyJson').onclick = () => copy(JSON.stringify(save, null, 1));
  $('reset').onclick = () => {
    if(!resetArmed){ resetArmed = true; $('rmsg').textContent = 'Click again to erase everything.'; setTimeout(() => { resetArmed = false; const m = $('rmsg'); if(m) m.textContent = ''; }, 4000); return; }
    const lang = save.lang; save = fresh(); save.lang = lang; persist(); resetArmed = false; renderAll();
  };
  $('dBack').onclick = () => { show('sMenu'); renderMenu(); };
}

/* outside claude.ai: browser speech recognition and a link back to the arcade */
function browserDict(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if(!SR) return null;
  let rec = null; const fin = [], st = [];
  return {
    onFinal(f){ fin.push(f); }, onState(f){ st.push(f); },
    start(){ return new Promise((res, rej) => { try {
      rec = new SR(); rec.lang = (bt ? bt.lang : save.lang) === 'fr' ? 'fr-FR' : 'en-US'; rec.continuous = true; rec.interimResults = false;
      rec.onresult = e => { for(let i = e.resultIndex; i < e.results.length; i++) if(e.results[i].isFinal) fin.forEach(f => f({text: e.results[i][0].transcript.trim()})); };
      rec.onstart = () => { st.forEach(f => f({state:'listening'})); res(); };
      rec.onend = () => st.forEach(f => f({state:'idle'}));
      rec.onerror = ev => rej(ev.error);
      rec.start(); } catch(e) { rej(e); } }); },
    stop(){ try { if(rec) rec.stop(); } catch(e) {} return Promise.resolve(); }
  };
}
if(!CL){ dict = browserDict(); if(dict) setupDict(); $('arcade').hidden = false; }

/* debug hook for automated tests only */
window.__aa = { get bt(){ return bt; }, get save(){ return save; }, step, frNum, summary };

renderAll();
}
